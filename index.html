<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal Pembeli – Subjek Tingkatan 1</title>
<style>
:root{--ink:#26264f;--card:#fff;--line:#e3dcff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f1eeff;--card:#2b2a5c;--line:#4b4a8a}}
*{box-sizing:inherit}
html{min-height:100%;background:linear-gradient(160deg,#ffe3ef,#e4f0ff,#e8ffe9,#fff4d6);background-size:300% 300%;animation:bg 20s ease infinite}
@media (prefers-color-scheme:dark){html{background:linear-gradient(160deg,#2a2150,#1c2f5c,#20483f);background-size:300% 300%}}
@keyframes bg{50%{background-position:100% 100%}}
body{margin:0;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center}
#fx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#fx span{position:absolute;bottom:-60px;opacity:.5;animation:fl linear infinite}
@keyframes fl{to{transform:translateY(-115vh) rotate(30deg)}}
#app{position:relative;z-index:1;width:100%;max-width:560px;padding:16px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:12px}
.card{background:var(--card);border:3px solid #fff;border-radius:26px;padding:22px;text-align:center;box-shadow:0 7px 0 rgba(0,0,0,.08)}
h1{margin:6px 0;font-size:28px;line-height:1.15}h2{margin:0 0 6px;font-size:21px}p{margin:6px 0;opacity:.8}
.logo{font-size:68px;line-height:1;animation:bob 1.6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-7px) rotate(6deg)}}
input{width:100%;font:inherit;font-size:17px;padding:14px;margin-top:10px;border-radius:14px;border:3px solid var(--line);background:transparent;color:var(--ink)}
button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:14px 18px;font-weight:700;font-size:18px;color:#fff;background:linear-gradient(135deg,#6c5ce7,#ff6b9d);box-shadow:0 5px 0 rgba(0,0,0,.2);width:100%;margin-top:14px}
button:active{transform:translateY(3px)}button:disabled{opacity:.6}
.lk{background:none;color:inherit;box-shadow:none;text-decoration:underline;font-size:15px;margin-top:8px;padding:6px;font-weight:600}
.msg{font-weight:700;min-height:22px;margin-top:8px}.er{color:#e5484d}.ok{color:#16a34a}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border-radius:20px;padding:10px 14px;border:3px solid #fff;font-weight:700}
.top div{display:flex;gap:8px}.top button{width:auto;margin:0;padding:8px 12px;font-size:15px;background:#6c5ce7}.top button+button{background:#ff6b6b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;padding:12px 8px;border:3px solid rgba(255,255,255,.85);border-radius:24px;color:#fff;text-decoration:none;text-align:center;box-shadow:0 7px 0 rgba(0,0,0,.18);text-shadow:0 2px 3px rgba(0,0,0,.3)}
.box.off{opacity:.55;border-style:dashed}
.em{font-size:48px;line-height:1;animation:bob 1.6s ease-in-out infinite alternate}
.nm{font-weight:800;font-size:17px;line-height:1.2}
.st{font-size:13px;font-weight:700;background:rgba(255,255,255,.28);padding:3px 10px;border-radius:12px}
@media (prefers-reduced-motion:reduce){html,#fx span,.logo,.em{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,updatePassword,updateProfile,reauthenticateWithCredential,EmailAuthProvider}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// 1) TAMPAL KONFIGURASI FIREBASE KAMU DI SINI (Project settings > Your apps > Web app)
const firebaseConfig={apiKey:"AIzaSyAKkAfDwes8Kt-DPL-aEY6zrphVU-RZL2o",authDomain:"latihan-interaktif-tingkatan-1.firebaseapp.com",projectId:"latihan-interaktif-tingkatan-1",appId:"1:765837133429:web:06ccdb98f7066701ce1a3c"};

const S=[['Bahasa Melayu','📖','#ff6b6b','#ff8e53'],['Bahasa Inggeris','🔤','#4dabf7','#5c7cfa'],['Matematik','🧮','#40c057','#12b886'],['Sains','🧪','#9775fa','#da77f2'],['Geografi','🌍','#15aabf','#63e6be'],['Pendidikan Islam','🕌','#2b8a3e','#8ce99a'],['Pendidikan Seni Visual','🎨','linear',''],['Pendidikan Moral','🤝','#f06595','#ffa8c5'],['Pendidikan Jasmani & Kesihatan','⚽','#f76707','#ffa94d'],['Sejarah','🏰','#a9712d','#e0a458'],['Reka Bentuk & Teknologi','🛠️','#364fc7','#4c6ef5']];
const ERR={'auth/invalid-credential':'Emel atau kata laluan salah.','auth/invalid-email':'Format emel tidak sah.','auth/user-disabled':'Akaun ini telah dinyahaktifkan.','auth/too-many-requests':'Terlalu banyak percubaan. Cuba lagi sebentar nanti.','auth/weak-password':'Kata laluan terlalu lemah (minimum 8 aksara).','auth/network-request-failed':'Tiada sambungan internet.','auth/requires-recent-login':'Sila log keluar dan masuk semula, kemudian cuba lagi.'};
const A=document.getElementById('app');
const mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const inp=(type,ph,ac)=>{const i=mk('input');i.type=type;i.placeholder=ph;if(ac)i.autocomplete=ac;return i};
const btn=(t,f,c)=>{const b=mk('button',c||'',t);b.onclick=f;return b};
const msg=(el,t,ok)=>{el.className='msg '+(ok?'ok':'er');el.textContent=t};
const em=e=>ERR[e.code]||'Ralat berlaku. Sila cuba lagi.';

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);

function loginView(){
  A.style.justifyContent='center';A.textContent='';const c=mk('div','card');
  c.append(mk('div','logo','🎒'),mk('h1','','Portal Pembeli'),mk('p','','Subjek Tingkatan 1. Log masuk untuk akses bahan pembelajaran.'));
  const e=inp('email','Emel','username'),p=inp('password','Kata laluan','current-password'),m=mk('div','msg');
  const go=async()=>{if(!e.value.trim()||!p.value)return msg(m,'Sila isi emel dan kata laluan.');b.disabled=true;msg(m,'Menyemak...',1);
    try{await signInWithEmailAndPassword(auth,e.value.trim(),p.value)}catch(x){msg(m,em(x));b.disabled=false}};
  const b=btn('🔓 Masuk',go);p.onkeydown=k=>{if(k.key==='Enter')go()};
  const f=btn('Lupa kata laluan?',async()=>{if(!e.value.trim())return msg(m,'Isi emel anda dahulu, kemudian tekan semula.');
    try{await sendPasswordResetEmail(auth,e.value.trim())}catch(x){}
    msg(m,'Jika emel itu berdaftar, pautan reset telah dihantar. Semak peti masuk dan spam.',1)},'lk');
  c.append(e,p,m,b,f);A.append(c);
}

async function home(u){
  A.style.justifyContent='flex-start';A.textContent='';
  const t=mk('div','top'),d=mk('div');
  t.append(mk('span','','👋 '+(u.displayName||u.email)));d.append(btn('⚙️ Akaun',()=>account(u)),btn('Keluar',()=>signOut(auth)));t.append(d);A.append(t);
  let L;try{const s=await getDoc(doc(db,'config','links'));L=s.exists()?(s.data().list||[]):[]}
  catch(x){const c=mk('div','card');c.append(mk('h2','','Akaun belum aktif'),mk('p','','Emel ini belum didaftarkan sebagai pembeli atau akses telah ditamatkan. Sila hubungi penjual.'));A.append(c);return}
  const g=mk('div','grid');
  S.forEach((s,i)=>{const ok=/^https?:\/\//i.test(L[i]||''),b=mk(ok?'a':'div','box'+(ok?'':' off'));
    b.style.background=s[2]=='linear'?'linear-gradient(135deg,#ff6b6b,#ffa94d,#51cf66,#4dabf7,#da77f2)':`linear-gradient(135deg,${s[2]},${s[3]})`;
    if(ok){b.href=L[i];b.target='_blank';b.rel='noopener noreferrer'}
    const e=mk('div','em',s[1]);e.style.animationDelay=-i*.3+'s';b.append(e,mk('div','nm',s[0]),mk('div','st',ok?'🔗 Buka':'🔜 Akan datang'));g.append(b)});
  A.append(g);
}

function account(u){
  A.style.justifyContent='flex-start';A.textContent='';
  A.append(btn('⬅️ Kembali',()=>home(u),'lk'));
  const n=mk('div','card'),nm=inp('text','Nama paparan (contoh: leyka)'),m1=mk('div','msg');nm.value=u.displayName||'';
  n.append(mk('h2','','👤 Nama paparan'),nm,m1,btn('Simpan nama',async()=>{try{await updateProfile(u,{displayName:nm.value.trim()});msg(m1,'Nama disimpan.',1)}catch(x){msg(m1,em(x))}}));
  const k=mk('div','card'),cur=inp('password','Kata laluan semasa','current-password'),nw=inp('password','Kata laluan baharu (min. 8 aksara)','new-password'),m2=mk('div','msg');
  k.append(mk('h2','','🔑 Tukar kata laluan'),cur,nw,m2,btn('Tukar kata laluan',async()=>{
    if(nw.value.length<8)return msg(m2,ERR['auth/weak-password']);
    try{await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,cur.value));await updatePassword(u,nw.value);cur.value=nw.value='';msg(m2,'Kata laluan berjaya ditukar.',1)}catch(x){msg(m2,em(x))}}));
  A.append(n,k);
}

onAuthStateChanged(auth,u=>u?home(u):loginView());
(()=>{const f=mk('div');f.id='fx';const E=['📚','✏️','⭐','🎒','✨','🔬','🎨','📐'];for(let i=0;i<14;i++){const s=mk('span','',E[i%E.length]);s.style.cssText=`left:${Math.random()*95}%;font-size:${20+Math.random()*24}px;animation-duration:${14+Math.random()*14}s;animation-delay:-${Math.random()*20}s`;f.append(s)}document.body.prepend(f)})();
</script>
</body>
</html>
