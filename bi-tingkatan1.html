een. Of time: at (jam), on (hari), in (bulan, tahun). Direction: across, into. Phrasal verb ialah verb + partikel: take off, turn on.',ADJ:'Adjective menerangkan noun (a tall boy). Possessive adjective: my, his, her, our, their. Comparative: taller than. Superlative: the tallest. Adjective panjang: more interesting, the most interesting.',FUT:'Future tense: will + verb (I will visit) atau am/is/are going to + verb (It is going to rain). Penanda: tomorrow, next week.',PUNC:'Huruf besar di awal ayat dan nama khas. Noktah (.) untuk ayat penyata, tanda tanya (?) untuk soalan, tanda seru (!) untuk perasaan kuat, koma (,) untuk senarai.',MOD:'Modals: can (kebolehan), may (kebenaran), might (kemungkinan). Selepas modal guna verb dasar: She can swim.',QF:'Soalan positif: Do you like fish? Soalan negatif: Don’t you like fish? Choice question memberi pilihan dengan or: Do you want tea or coffee?',SIM:'Simile membandingkan dua benda dengan as...as atau like: as busy as a bee, as brave as a lion.',VOC:'Guna kamus untuk mencari makna perkataan (susunan abjad). Sinonim ialah makna sama (big, large). Antonim ialah makna berlawan (hot, cold).',SOUND:'Bunyi vokal pendek dan panjang membezakan makna: ship /ɪ/ lawan sheep /iː/. Diftong ialah dua bunyi vokal bergabung (boy, house). Sebut dan dengar dengan teliti.',SKILL:'Skimming: baca laju untuk idea am. Scanning: cari maklumat khusus. Main idea ialah perkara paling penting. i-THINK: circle map (takrif), bubble map (sifat), double bubble (banding), flow map (urutan), tree map (klasifikasi), multi-flow (sebab dan akibat).',LIT:'Poem ada stanza dan rima. Short story ada setting, characters, plot dan moral value. Graphic novel ialah cerita dengan gambar dan teks. Drama dibahagi kepada acts dan scenes.'};

  if(q.t=='m')h+='<div class="card q">'+e(q.q)+'</div><div class="ans">'+q.o.map((o,i)=>'<button onclick="pk('+i+')">'+e(o)+'</button>').join('')+'</div><div id="fb"></div>';
  else if(q.t=='s')h+='<div class="card q">'+e(q.q)+'</div><input id="in" autocomplete="off" autocapitalize="off" placeholder="Taip jawapan anda"><button onclick="chk()">✅ Semak</button><div id="fb"></div>';
  else{var f=FMT[q.f];h+='<div class="card q">'+e(q.q)+'</div><div class="card nt"><b>📋 Kehendak soalan</b><p>Format: '+f[0]+'<br>Audience: '+q.au+'<br>Tense: '+f[3]+'<br>Susunan: '+e(f[1])+'</p></div><textarea id="in" oninput="wc()" placeholder="Tulis jawapan anda di sini"></textarea><div id="wc" style="text-align:right;font-size:14px">0 patah perkataan</div><div class="card"><b>Semak sendiri:</b>'+f[2].concat(['Semua isi yang diminta dijawab','Tense dan subject-verb agreement betul','Ejaan, huruf besar dan tanda baca disemak']).map((t,i)=>'<label class="ck"><input type="checkbox" class="cb"><span>'+e(t)+'</span></label>').join('')+'</div><button class="b5" onclick="frame()">💡 Lihat rangka</button><div id="fb"></div><button class="nx" onclick="ess()">'+(C.i+1>=C.q.length?'Lihat Keputusan 🏁':'Seterusnya ➡️')+'</button>'}
  A.innerHTML=h;scrollTo(0,0)}
function nx(){return '<button class="nx" onclick="C.i++;show()">'+(C.i+1>=C.q.length?'Lihat Keputusan 🏁':'Seterusnya ➡️')+'</button>'}
function pk(i){if(C.lock)return;C.lock=1;var q=C.cur,ok=q.o[i]==q.a,bs=document.querySelectorAll('.ans button');
  bs.forEach((b,j)=>{if(q.o[j]==q.a)b.classList.add('ok')});
  if(ok){C.a++;snd(660,.15)}else{bs[i].classList.add('no','sh');C.w.push(q);snd(200,.3,'square')}
  var fb=document.getElementById('fb');fb.innerHTML='<div class="fb"><b>'+(ok?'Correct! 🎉':'Not quite 💪 Answer: '+e(q.a))+'</b>'+(q.x?'<br>📝 '+e(q.x):'')+'</div>'+nx();fb.scrollIntoView({behavior:'smooth',block:'end'})}
function chk(){if(C.lock)return;var q=C.cur,v=document.getElementById('in').value;if(!v.trim())return;C.lock=1;
  var ok=q.kw?q.kw.some(k=>nm(v).indexOf(k)>-1):nm(v,q.cs)==nm(q.a,q.cs);
  if(ok){C.b++;snd(660,.15)}else{C.w.push(q);snd(200,.3,'square')}
  var fb=document.getElementById('fb');fb.innerHTML='<div class="fb"><b>'+(ok?'Correct! 🎉':'Not quite 💪 Model answer: '+e(q.a))+'</b>'+(q.x?'<br>📝 '+e(q.x):'')+(ok?'':'<br><button class="b3" style="margin-top:8px" onclick="ovr(this)">Jawapan saya betul juga ✅</button>')+'</div>'+nx();fb.scrollIntoView({behavior:'smooth',block:'end'})}
function ovr(b){C.b++;C.w.pop();b.outerHTML='<b>✅ Dikira betul</b>'}
function wc(){var n=document.getElementById('in').value.trim().split(/\s+/).filter(Boolean).length;document.getElementById('wc').textContent=n+' patah perkataan'}
function frame(){var f=FMT[C.cur.f];document.getElementById('fb').innerHTML='<div class="fb nt"><b>Rangka '+f[0]+'</b><p>'+e(f[4])+'</p></div>'}
function ess(){var cb=document.querySelectorAll('.cb'),n=0;cb.forEach(x=>{if(x.checked)n++});var r=n/cb.length;C.c+=r>=.8?1:r>=.5?.5:0;C.i++;show()}
function end(){var n=C.q.length,sec=Math.round((Date.now()-C.t0)/1000),p=C.a+C.b+C.c,r=p/n,s3=r>=.9?3:r>=.65?2:r>=.4?1:0;
  H[C.u]=[{t:Date.now(),p:p,a:C.a,b:C.b,c:C.c,sec:sec}].concat(H[C.u]||[]).slice(0,30);try{localStorage.setItem('bi1_v1',JSON.stringify(H))}catch(x){}
  snd(s3>1?880:300,.4);
  A.innerHTML='<div class="card"><div class="big">'+(s3>1?'🏆':'📖')+'</div><h1>Bab '+C.u+' Selesai!</h1><div class="st">'+'⭐'.repeat(s3)+'☆'.repeat(3-s3)+'</div><p>Jumlah: <b>'+p+'/'+n+'</b> ('+Math.round(r*100)+'%) · Masa '+tm(sec)+'</p><p>A Objektif '+C.a+'/20 · B Subjektif '+C.b+'/8 · C Karangan '+C.c+'/2</p></div>'
  +(C.w.length?'<div class="card"><b>Semak soalan yang salah ('+C.w.length+')</b>'+C.w.map(q=>'<div class="row"><span>❌</span><span>'+e(q.q)+'<br><b>Answer: '+e(q.a)+'</b></span></div>').join('')+'</div>':'')
  +'<button class="b4" onclick="go('+C.u+')">🔁 Main Semula</button><button class="b5" onclick="nt('+C.u+')">📘 Nota Bab '+C.u+'</button><button class="b3" onclick="hist('+C.u+')">📒 Sejarah Bab '+C.u+'</button><button onclick="menu()">🏠 Senarai Bab</button><button style="background:#e8507a" onclick="location.href=HOME">🏠 Halaman Utama (subjek lain)</button>';scrollTo(0,0)}
function hist(u){var l=H[u]||[],b=l.reduce((m,x)=>Math.max(m,x.p),0),av=l.length?Math.round(l.reduce((m,x)=>m+x.p/30,0)/l.length*100):0;
  var h='<button class="bk" onclick="menu()">⬅️ Kembali</button><div class="card"><h2>📒 Sejarah Bab '+u+'</h2><p>'+e(CH[u-1][0])+'</p><p>'+l.length+' cubaan · Terbaik '+b+'/30 · Purata '+av+'%</p></div>';
  if(!l.length)h+='<div class="card"><p>Belum ada aktiviti untuk bab ini. Jom cuba! 🚀</p></div>';
  else h+='<div class="card"><b>Cubaan terkini</b>'+l.map((x,i)=>'<div class="row"><span style="flex:1">'+(i?'':'🆕 ')+new Date(x.t).toLocaleString('ms-MY',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'<br><b>'+x.p+'/30</b> · A '+x.a+'/20 · B '+x.b+'/8 · C '+x.c+'/2 · '+tm(x.sec)+'<div class="pb"><i style="width:'+x.p/30*100+'%"></i></div></span></div>').join('')+'</div>';
  A.innerHTML=h+'<button class="b4" onclick="go('+u+')">▶️ Main Bab '+u+'</button>';scrollTo(0,0)}
(function(){var f=document.createElement('div');f.id='fx';var E=['📚','✏️','⭐','🔤','✨','📖','🌍','🎈'];for(var i=0;i<14;i++){var s=document.createElement('span');s.textContent=E[i%E.length];s.style.cssText='left:'+Math.random()*95+'%;font-size:'+(20+Math.random()*24)+'px;animation-duration:'+(14+Math.random()*14)+'s;animation-delay:-'+Math.random()*20+'s';f.appendChild(s)}document.body.prepend(f)})();
menu();
</script>
</body>
</html>
