<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kuiz Geografi Tingkatan 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&display=swap');

/* Susun atur: bar atas melekat (Semua Bab / Laman Utama), lajur tunggal 760px; kad bab berwarna ikut bab; kuiz satu soalan setiap skrin dengan rajah di atas. */
:root {
  --bg: #f6f2fb; --card: #ffffff; --card2: #efe8f8; --fg: #1d1a3a; --muted: #5a5580; --line: #d9cfee;
  --brand: #c13a68; --brand-fg: #ffffff; --sun: #f2a93b;
  --good: #17784f; --good-bg: #dff4e9; --bad: #b8302d; --bad-bg: #fde6e5;
  --chS: 62%; --chL: 40%; --sS: 70%; --sL: 93%;
  --head: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Lexend', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15122b; --card: #1f1b3e; --card2: #2a2552; --fg: #f1eefc; --muted: #b4add8; --line: #3b3568;
    --brand: #ff7ba3; --brand-fg: #1d1a3a; --sun: #ffc15a;
    --good: #66dba5; --good-bg: #17382d; --bad: #ff9a96; --bad-bg: #432024;
    --chS: 82%; --chL: 72%; --sS: 38%; --sL: 24%; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15122b; --card: #1f1b3e; --card2: #2a2552; --fg: #f1eefc; --muted: #b4add8; --line: #3b3568;
  --brand: #ff7ba3; --brand-fg: #1d1a3a; --sun: #ffc15a;
  --good: #66dba5; --good-bg: #17382d; --bad: #ff9a96; --bad-bg: #432024;
  --chS: 82%; --chL: 72%; --sS: 38%; --sL: 24%; color-scheme: dark;
}
#app, .bab, .rv { --ch: hsl(var(--h, 340) var(--chS) var(--chL)); --chsoft: hsl(var(--h, 340) var(--sS) var(--sL)); }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--card); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--head); line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); }
.wrap { max-width: 760px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; align-items: center; gap: 10px; padding-block: 9px; }
.brand { font-family: var(--head); font-weight: 700; font-size: 17px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 14px; font-weight: 500; font-size: 14px; text-decoration: none; color: var(--fg); display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; }
.btn:hover { border-color: var(--brand); }
.btn.pri { background: var(--brand); border-color: var(--brand); color: var(--brand-fg); font-weight: 600; }
.btn.pri:hover { filter: brightness(1.06); }
.btn.sm { min-height: 38px; padding: 6px 12px; }
.btn[hidden] { display: none; }
main { padding-block: 18px 40px; }

/* Laman bab */
.hero { display: grid; gap: 8px; margin-bottom: 16px; }
.hero h1 { font-size: clamp(28px, 7vw, 40px); font-weight: 800; }
.hero p { color: var(--muted); max-width: 52ch; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; flex: 1 1 110px; min-width: 0; }
.stat b { display: block; font-family: var(--head); font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12.5px; }
.grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
.bab { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 14px; text-align: left; width: 100%; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 14px; align-items: center; }
.bab:hover { border-color: var(--ch); }
.bab .no { height: 62px; border-radius: 14px; background: var(--chsoft); color: var(--ch); font-family: var(--head); font-weight: 800; font-size: 34px; display: grid; place-items: center; }
.bab h3 { font-size: 18px; font-weight: 700; }
.bab .meta { color: var(--muted); font-size: 12.5px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.stars { display: inline-flex; gap: 2px; vertical-align: middle; }
.stars svg { width: 15px; height: 15px; }
.star-on { fill: var(--sun); stroke: var(--sun); }
.star-off { fill: none; stroke: var(--line); }
.weak { margin-top: 12px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--card2); border-radius: 16px; padding: 14px; }
.weak p { flex: 1 1 200px; min-width: 0; }

/* Dalam bab */
.chead { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
.chead .no { width: 54px; height: 54px; flex: none; border-radius: 14px; background: var(--chsoft); color: var(--ch); font-family: var(--head); font-weight: 800; font-size: 30px; display: grid; place-items: center; }
.chead h2 { font-size: clamp(22px, 5.5vw, 30px); font-weight: 800; }
.chead small { color: var(--muted); font-size: 12.5px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--card2); padding: 5px; border-radius: 14px; margin-bottom: 16px; }
.tab { border: 0; background: transparent; border-radius: 10px; padding: 10px; font-weight: 600; }
.tab[aria-selected="true"] { background: var(--card); box-shadow: 0 1px 0 var(--line), 0 0 0 2px var(--ch) inset; color: var(--fg); }
.note { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
.note h3 { font-size: 19px; font-weight: 700; color: var(--ch); margin-bottom: 6px; }
.note ul { margin: 0; padding-left: 20px; display: grid; gap: 5px; }
.note li::marker { color: var(--ch); }
.kw { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.kw span { background: var(--chsoft); color: var(--fg); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 500; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 14px; }
.lvrow { display: flex; gap: 8px; flex-wrap: wrap; }
.lv { border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 600; background: var(--card2); color: var(--fg); }
.lv.l1 { background: var(--good-bg); color: var(--good); }
.lv.l2 { background: var(--chsoft); color: var(--fg); }
.lv.l3 { background: var(--bad-bg); color: var(--bad); }
.switch { display: flex; align-items: center; gap: 10px; }
.switch input { width: 22px; height: 22px; accent-color: var(--brand); flex: none; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* Kuiz */
.qtop { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { height: 10px; background: var(--card2); border-radius: 999px; overflow: hidden; margin-bottom: 14px; }
.bar i { display: block; height: 100%; background: var(--ch); border-radius: 999px; transition: width .3s; }
.bar.time i { background: var(--sun); transition: width .1s linear; }
.qcard { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 14px; display: grid; gap: 14px; }
.qtext { font-size: 17px; font-weight: 500; line-height: 1.5; }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; min-height: 52px; }
.opt:hover:not(:disabled) { border-color: var(--ch); }
.opt .ltr { width: 32px; height: 32px; border-radius: 10px; background: var(--chsoft); color: var(--fg); font-family: var(--head); font-weight: 700; font-size: 17px; display: grid; place-items: center; }
.opt:disabled { cursor: default; }
.opt.ok { border-color: var(--good); background: var(--good-bg); }
.opt.ok .ltr { background: var(--good); color: var(--good-bg); }
.opt.no { border-color: var(--bad); background: var(--bad-bg); }
.opt.no .ltr { background: var(--bad); color: var(--bad-bg); }
.opt.dim { opacity: .6; }
.fb { border-radius: 14px; padding: 12px 14px; display: grid; gap: 4px; }
.fb.good { background: var(--good-bg); }
.fb.bad { background: var(--bad-bg); }
.fb b { font-family: var(--head); font-size: 18px; }
.fb.good b { color: var(--good); }
.fb.bad b { color: var(--bad); }

/* Rajah */
.dg { margin: 0; background: var(--card2); border-radius: 14px; padding: 8px 6px 6px; }
.dg svg { display: block; width: 100%; height: auto; max-width: 520px; margin-inline: auto; }
.dg figcaption { font-size: 13px; color: var(--muted); padding: 6px 8px 4px; font-style: italic; }
.dg text { font-family: var(--body); fill: var(--fg); }
.dg .t1 { font-size: 13px; font-weight: 600; }
.dg .t2 { font-size: 11.5px; fill: var(--muted); }
.dg .t3 { font-size: 11.5px; }
.dg .tb { font-weight: 700; }
.dg .tq { font-family: var(--head); font-weight: 800; font-size: 18px; fill: var(--ch); }
.dg .box { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
.dg .hl { fill: var(--chsoft); stroke: var(--ch); stroke-width: 2; }
.dg .qq { fill: none; stroke: var(--ch); stroke-width: 2; stroke-dasharray: 5 4; }
.dg .th { fill: var(--chsoft); stroke: var(--line); stroke-width: 1.5; }
.dg .ln { stroke: var(--line); stroke-width: 2; fill: none; }
.dg .ar { stroke: var(--ch); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.dg .dot { fill: var(--card); stroke: var(--ch); stroke-width: 2.5; }
.dg .doth { fill: var(--ch); stroke: var(--ch); stroke-width: 2.5; }
.dg .num { fill: var(--ch); }
.dg .numt { font-size: 11px; font-weight: 700; fill: var(--bg); }
.dg .barf { fill: var(--ch); }
.dg .ic path { fill: none; stroke: var(--fg); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.dg .vc1 { fill: var(--ch); fill-opacity: .22; stroke: var(--ch); stroke-width: 2; }
.dg .vc2 { fill: var(--sun); fill-opacity: .28; stroke: var(--sun); stroke-width: 2; }

/* Keputusan dan semakan */
.score { text-align: center; display: grid; gap: 8px; justify-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px 16px; }
.score .big { font-family: var(--head); font-weight: 800; font-size: 56px; line-height: 1; color: var(--ch); font-variant-numeric: tabular-nums; }
.score .stars svg { width: 34px; height: 34px; }
.break { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; margin-top: 6px; }
.break div { background: var(--card2); border-radius: 12px; padding: 8px 4px; }
.break b { display: block; font-family: var(--head); font-size: 20px; font-variant-numeric: tabular-nums; }
.break span { font-size: 12px; color: var(--muted); }
.sec { margin: 22px 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sec h3 { font-size: 22px; font-weight: 700; }
.chips { display: flex; gap: 6px; }
.chip { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ch); border-color: var(--ch); color: var(--bg); }
.rv { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 12px; display: grid; gap: 10px; }
.rv .tag { font-size: 12.5px; font-weight: 600; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ans { display: grid; gap: 6px; }
.ans div { border-radius: 10px; padding: 8px 12px; font-size: 14.5px; }
.ans .y { background: var(--bad-bg); }
.ans .c { background: var(--good-bg); }
.ans b { font-size: 12px; display: block; opacity: .85; }
.exp { font-size: 14.5px; color: var(--fg); border-left: 4px solid var(--ch); padding-left: 12px; }
.empty { text-align: center; color: var(--muted); padding: 20px; background: var(--card); border: 1px dashed var(--line); border-radius: 16px; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }

.dg .halo { paint-order: stroke; stroke: var(--card2); stroke-width: 4px; stroke-linejoin: round; }
.dg .ct { fill: none; stroke: var(--ch); stroke-width: 1.8; }
.dg .lyr { stroke: var(--card2); stroke-width: 1.5; }
.dg .lyh { stroke: var(--ch); stroke-width: 3; }
.secname { font-size: 19px; font-weight: 700; margin: 22px 0 10px; color: var(--muted); }
.secname:first-of-type { margin-top: 4px; }

</style>

      b += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x1.toFixed(1) + '" y2="' + y1.toFixed(1) + '" class="' + (hl ? 'ar' : 'ln') + '" stroke-width="' + (hl ? 3.5 : card ? 2 : 1.2) + '"/>';
      if (hl) b += '<circle cx="' + lx.toFixed(1) + '" cy="' + ly.toFixed(1) + '" r="15" class="hl"/>';
      if (hid) b += '<circle cx="' + lx.toFixed(1) + '" cy="' + ly.toFixed(1) + '" r="15" class="qq"/>' + T(lx.toFixed(1), ly.toFixed(1), '?', 'tq', 'middle');
      else b += T(lx.toFixed(1), ly.toFixed(1), c, 't1' + (card ? ' tb' : ''), 'middle');
    });
    b += '<circle cx="' + cx + '" cy="' + cy + '" r="4" class="num"/>';
    if (d.ang != null) {
      var an = d.ang * Math.PI / 180, ex = cx + 64 * Math.sin(an), ey = cy - 64 * Math.cos(an);
      b += '<line x1="' + cx + '" y1="' + cy + '" x2="' + cx + '" y2="' + (cy - 64) + '" class="ln" stroke-dasharray="4 4"/>';
      b += '<line x1="' + cx + '" y1="' + cy + '" x2="' + ex.toFixed(1) + '" y2="' + ey.toFixed(1) + '" class="ar" stroke-width="3.5"/>';
      var ah = 9, ux = Math.sin(an), uy = -Math.cos(an), px = -uy, py = ux;
      b += '<path d="M' + ex.toFixed(1) + ' ' + ey.toFixed(1) + 'l' + (-ux * ah + px * 5).toFixed(1) + ' ' + (-uy * ah + py * 5).toFixed(1) + 'M' + ex.toFixed(1) + ' ' + ey.toFixed(1) + 'l' + (-ux * ah - px * 5).toFixed(1) + ' ' + (-uy * ah - py * 5).toFixed(1) + '" class="ar"/>';
      var rr = 30, sx = cx, sy = cy - rr, tx = cx + rr * Math.sin(an), ty = cy - rr * Math.cos(an);
      if (d.ang > 0) b += '<path d="M' + sx + ' ' + sy + 'A' + rr + ' ' + rr + ' 0 ' + (d.ang > 180 ? 1 : 0) + ' 1 ' + tx.toFixed(1) + ' ' + ty.toFixed(1) + '" class="ar" stroke-width="1.6"/>';
      var mid = d.ang / 2 * Math.PI / 180, lbl = d.hide.indexOf('ang') >= 0 ? '?' : d.ang + '°';
      b += '<g>' + T((cx + 46 * Math.sin(mid)).toFixed(1), (cy - 46 * Math.cos(mid)).toFixed(1), lbl, 't1 tb halo', 'middle') + '</g>';
    }
    return { h: 244, b: b };
  }
  function dGR(d) {
    var nc = d.xl.length, nr = d.yl.length, x0 = 58, x1 = 336, y0 = 20, stepY = Math.min(46, 180 / (nr - 1)), y1 = y0 + (nr - 1) * stepY, b = '';
    var sx = (x1 - x0) / (nc - 1);
    d.xl.forEach(function (l, i) { var x = x0 + i * sx; b += '<line x1="' + x + '" y1="' + y0 + '" x2="' + x + '" y2="' + y1 + '" class="ln" stroke-width="1.4"/>' + T(x, y1 + 18, l, 't3', 'middle'); });
    d.yl.forEach(function (l, j) { var y = y0 + j * stepY; b += '<line x1="' + x0 + '" y1="' + y + '" x2="' + x1 + '" y2="' + y + '" class="ln" stroke-width="1.4"/>' + T(x0 - 8, y, l, 't3', 'end'); });
    d.m.forEach(function (m) {
      var x = x0 + m[0] * sx, y = y0 + m[1] * stepY, q = m[2] === '?', right = x > 230;
      if (q) b += '<circle cx="' + x + '" cy="' + y + '" r="11" class="qq"/>' + T(x, y, '?', 'tq', 'middle');
      else b += '<circle cx="' + x + '" cy="' + y + '" r="6" class="doth"/>' + '<g>' + T(right ? x - 10 : x + 10, y - 11, m[2], 't1 tb halo', right ? 'end' : 'start') + '</g>';
    });
    return { h: y1 + 32, b: b };
  }
  function dCT(d) {
    var n = d.labels.length, cx = 180, cy = 120, b = '', i;
    function ell(x, y, rx, ry) { return '<ellipse cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" rx="' + rx.toFixed(1) + '" ry="' + ry.toFixed(1) + '" class="ct"/>'; }
    for (i = 0; i < n; i++) {
      var rx, ry, x = cx, tx;
      if (d.kind === 'curam') { rx = 124 - i * 10; ry = rx * .62; }
      else if (d.kind === 'landai') { rx = 160 - i * (120 / Math.max(1, n - 1)); ry = rx * .62; }
      else if (d.kind === 'tidaksekata') { var l = 40 + i * 9, r = 322 - i * (250 / Math.max(1, n - 1)) * .62; rx = (r - l) / 2; x = (l + r) / 2; ry = 100 - i * 16; }
      else { rx = 150 - i * (100 / Math.max(1, n - 1)); ry = rx * .62; }
      if (ry < 14) ry = 14;
      var th = d.kind === 'curam' ? (-90 + i * 26) * Math.PI / 180 : -Math.PI / 2;
      b += ell(x, cy, rx, ry) + '<g>' + T((x + rx * Math.cos(th)).toFixed(1), (cy + ry * Math.sin(th)).toFixed(1), d.labels[i], 't3 halo', 'middle') + '</g>';
    }
    if (d.kind === 'bukit') b += '<path d="M180 ' + (cy - 5) + 'l8 12h-16z" class="doth"/>';
    return { h: 244, b: b };
  }
  function dLY(d) {
    var n = d.l.length, cx = 106, cy = 118, R = 100, b = '', i;
    for (i = 0; i < n; i++) { var r = R * (n - i) / n; b += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r.toFixed(1) + '" fill="var(--ch)" fill-opacity="' + (.08 + i * .14).toFixed(2) + '" class="lyr' + (i === d.hl ? ' lyh' : '') + '"/>'; }
    for (i = 0; i < n; i++) {
      var rm = R * (n - i - .5) / n, a = (-30 - i * 6) * Math.PI / 180, ax = cx + rm * Math.cos(a), ay = cy + rm * Math.sin(a), ly = 30 + i * (176 / Math.max(1, n - 1)), q = d.l[i] === '?';
      b += '<circle cx="' + ax.toFixed(1) + '" cy="' + ay.toFixed(1) + '" r="3.5" class="num"/><line x1="' + ax.toFixed(1) + '" y1="' + ay.toFixed(1) + '" x2="222" y2="' + ly.toFixed(1) + '" class="ln" stroke-width="1.4"/>';
      b += q ? '<rect x="226" y="' + (ly - 13) + '" width="46" height="26" rx="8" class="qq"/>' + T(249, ly, '?', 'tq', 'middle') : T(228, ly, d.l[i], 't1' + (i === d.hl ? ' tb' : ''));
    }
    return { h: 238, b: b };
  }
  var DR = { CP: dCP, GR: dGR, CT: dCT, LY: dLY, TL: dTL, FL: dFL, CY: dCY, TB: dTB, BR: dBR, TR: dTR, IC: dIC, VN: dVN };
  function fig(d) {
    var r = DR[d.t](d);
    return '<figure class="dg"><svg viewBox="0 0 360 ' + r.h + '" role="img" aria-label="Rajah rujukan soalan">' + r.b + '</svg>' + (d.cap ? '<figcaption>' + esc(d.cap) + '</figcaption>' : '') + '</figure>';
  }

  /* ---------- Paparan ---------- */
  var S = { view: 'home', b: 0, tab: 'nota' }, Z = null, timerId = null, rvFilter = 'salah';
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
  function setHue(i) { app.style.setProperty('--h', HUE[i % HUE.length]); }
  function stars(n, big) { var h = '<span class="stars" aria-label="' + n + ' bintang">'; for (var i = 0; i < 3; i++) h += '<svg viewBox="0 0 48 48" class="' + (i < n ? 'star-on' : 'star-off') + '" stroke-width="3" stroke-linejoin="round"><path d="' + ICONS.star + '"/></svg>'; return h + '</span>'; }
  function starsFor(sc, tot) { var p = sc / tot; return p >= .9 ? 3 : p >= .7 ? 2 : p >= .5 ? 1 : 0; }
  function go(v, extra) { stopTimer(); S.view = v; if (extra) for (var k in extra) S[k] = extra[k]; render(); window.scrollTo(0, 0); }

  function render() {
    btnMenu.hidden = S.view === 'home';
    if (S.view === 'home') return home();
    setHue(S.b);
    if (S.view === 'bab') return babView();
    if (S.view === 'quiz') return quizView();
    if (S.view === 'hasil') return hasil();
  }

  function home() {
    app.style.removeProperty('--h');
    var done = 0, sum = 0, weakN = 0;
    BAB.forEach(function (b) { var bs = store.best[b.id]; if (bs) { done++; sum += bs.s / bs.t; } weakN += (store.wrong[b.id] || []).length; });
    var h = '<section class="hero"><h1>Kuiz Geografi Tingkatan 1</h1><p>Baca nota ringkas, jawab 30 soalan setiap bab dengan rajah rujukan, kemudian semak semula soalan yang salah.</p></section>';
    h += '<div class="stats"><div class="stat"><b>' + done + '/' + BAB.length + '</b><span>Bab dicuba</span></div><div class="stat"><b>' + (done ? Math.round(sum / done * 100) + '%' : '-') + '</b><span>Purata markah terbaik</span></div><div class="stat"><b>' + weakN + '</b><span>Soalan perlu diulang</span></div></div>';
    var open_ = false;
    BAB.forEach(function (b, i) {
      var bs = store.best[b.id];
      if (SECS[b.id]) { if (open_) h += '</div>'; h += '<h2 class="secname">' + esc(SECS[b.id]) + '</h2><div class="grid">'; open_ = true; }
      h += '<button class="bab" style="--h:' + HUE[i % HUE.length] + '" data-act="open" data-i="' + i + '"><span class="no">' + b.id + '</span><span><h3>' + esc(b.tajuk) + '</h3><span class="meta"><span>Nota + ' + b.soalan.length + ' soalan</span>' + (bs ? '<span>Terbaik ' + bs.s + '/' + bs.t + '</span>' + stars(starsFor(bs.s, bs.t)) : '<span>Belum dicuba</span>') + '</span></span></button>';
    });
    if (open_) h += '</div>';
    if (weakN) h += '<div class="weak"><p><b>Latihan soalan lemah</b><br>Ulang ' + weakN + ' soalan yang pernah anda jawab salah, dari semua bab.</p><button class="btn pri" data-act="weakall">Mula latihan</button></div>';
    app.innerHTML = h;
  }

  function babView() {
    var b = BAB[S.b], h = '<div class="chead"><span class="no">' + b.id + '</span><div><small>Bab ' + b.id + '</small><h2>' + esc(b.tajuk) + '</h2></div></div>';
    h += '<div class="tabs" role="tablist"><button class="tab" role="tab" data-act="tab" data-t="nota" aria-selected="' + (S.tab === 'nota') + '">Nota ringkas</button><button class="tab" role="tab" data-act="tab" data-t="kuiz" aria-selected="' + (S.tab === 'kuiz') + '">Kuiz</button></div>';
    if (S.tab === 'nota') {
      b.nota.forEach(function (n) {
        h += '<section class="note"><h3>' + esc(n.h) + '</h3><ul>' + n.pts.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>';
        if (n.kw.length) h += '<div class="kw" aria-label="Kata kunci">' + n.kw.map(function (k) { return '<span>' + esc(k) + '</span>'; }).join('') + '</div>';
        h += '</section>';
      });
      h += '<div class="actions"><button class="btn pri" data-act="tab" data-t="kuiz">Sedia? Mulakan kuiz</button></div>';
    } else {
      var lv = { 1: 0, 2: 0, 3: 0 }; b.soalan.forEach(function (q) { lv[q.l]++; });
      var bs = store.best[b.id], wr = (store.wrong[b.id] || []).filter(function (i) { return i < b.soalan.length; });
      h += '<div class="panel"><div><h3>' + b.soalan.length + ' soalan bergambar rajah</h3><p style="color:var(--muted);margin-top:4px">Setiap soalan ada rajah rujukan. Selepas menjawab, anda terus nampak penjelasan.</p></div>';
      h += '<div class="lvrow"><span class="lv l1">Rendah ' + lv[1] + '</span><span class="lv l2">Sederhana ' + lv[2] + '</span><span class="lv l3">KBAT ' + lv[3] + '</span></div>';
      if (bs) h += '<p>Markah terbaik: <b>' + bs.s + '/' + bs.t + '</b> ' + stars(starsFor(bs.s, bs.t)) + '</p>';
      h += '<label class="switch"><input type="checkbox" id="timerChk"' + (store.timer ? ' checked' : '') + ' data-act="timer"><span>Mod masa: 40 saat setiap soalan</span></label>';
      h += '<div class="actions"><button class="btn pri" data-act="start">Mula kuiz</button>' + (wr.length ? '<button class="btn" data-act="startwrong">Ulang ' + wr.length + ' soalan salah</button>' : '') + '</div></div>';
    }
    app.innerHTML = h;
  }

  /* ---------- Kuiz ---------- */
  function newSession(items, mode) {
    Z = { mode: mode, items: shuffle(items), i: 0, pts: 0, streak: 0, maxStreak: 0, res: [], picked: -1, opts: [], left: 40 };
  }
  function startQuiz(mode) {
    var b = BAB[S.b], idx;
    if (mode === 'wrong') idx = (store.wrong[b.id] || []).filter(function (i) { return i < b.soalan.length; });
    else idx = b.soalan.map(function (_, i) { return i; });
    if (!idx.length) return;
    newSession(idx.map(function (i) { return { b: S.b, i: i }; }), mode);
    go('quiz');
  }
  function startWeakAll() {
    var items = [];
    BAB.forEach(function (b, bi) { (store.wrong[b.id] || []).forEach(function (i) { if (i < b.soalan.length) items.push({ b: bi, i: i }); }); });
    if (!items.length) return;
    S.b = items[0].b; newSession(items, 'weak'); go('quiz');
  }
  function cur() { var it = Z.items[Z.i]; return { it: it, q: BAB[it.b].soalan[it.i] }; }
  function quizView() {
    var c = cur(), q = c.q, n = Z.items.length;
    S.b = c.it.b; setHue(S.b);
    if (Z.picked === -1 && Z.opts.length === 0) Z.opts = shuffle([0, 1, 2, 3]);
    var h = '<div class="qtop"><span class="pill">Soalan ' + (Z.i + 1) + '/' + n + '</span><span class="lv l' + q.l + '">' + LVN[q.l] + '</span><span class="pill">' + Z.pts + ' mata' + (Z.streak > 1 ? ' · ' + Z.streak + ' berturut' : '') + '</span></div>';
    h += '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + Z.i + '"><i style="width:' + (Z.i / n * 100) + '%"></i></div>';
    if (store.timer && Z.picked === -1) h += '<div class="bar time" aria-hidden="true"><i id="tbar" style="width:100%"></i></div>';
    h += '<div class="qcard">' + fig(q.d) + '<p class="qtext">' + esc(q.q) + '</p><div class="opts" id="opts">';
    Z.opts.forEach(function (oi, k) {
      var cls = 'opt', dis = '';
      if (Z.picked !== -1) { dis = ' disabled'; if (oi === 0) cls += ' ok'; else if (oi === Z.picked) cls += ' no'; else cls += ' dim'; }
      h += '<button class="' + cls + '"' + dis + ' data-act="pick" data-o="' + oi + '"><span class="ltr">' + 'ABCD'[k] + '</span><span>' + esc(q.o[oi]) + '</span></button>';
    });
    h += '</div>';
    if (Z.picked !== -1) {
      var ok = Z.picked === 0;
      h += '<div class="fb ' + (ok ? 'good' : 'bad') + '" id="fb"><b>' + (ok ? 'Betul!' : (Z.picked === -2 ? 'Masa tamat' : 'Belum tepat')) + '</b><span>' + esc(q.e) + '</span></div>';
      h += '<div class="actions"><button class="btn pri" data-act="next">' + (Z.i + 1 >= n ? 'Lihat keputusan' : 'Soalan seterusnya') + '</button></div>';
    }
    h += '</div><div class="actions" style="margin-top:14px"><button class="btn sm" data-act="quit">Berhenti dan kembali ke bab</button></div>';
    app.innerHTML = h;
    if (store.timer && Z.picked === -1) startTimer();
    if (Z.picked !== -1) { var fb = document.getElementById('fb'); if (fb && fb.scrollIntoView) fb.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' }); }
  }
  function startTimer() {
    stopTimer(); Z.left = 40; var t0 = Date.now();
    timerId = setInterval(function () {
      var el = document.getElementById('tbar'); if (!el) { stopTimer(); return; }
      var f = 1 - (Date.now() - t0) / 40000; el.style.width = Math.max(0, f * 100) + '%';
      if (f <= 0) { stopTimer(); answer(-2); }
    }, 100);
  }
  function answer(oi) {
    if (Z.picked !== -1) return;

    Z.picked = oi;

    Z.res.push({ b: c.it.b, i: c.it.i, pick: oi, ok: ok, opts: Z.opts.slice() });
    quizView();
  }
  function nextQ() {
    if (Z.i + 1 >= Z.items.length) return finish();
    Z.i++; Z.picked = -1; Z.opts = []; quizView(); window.scrollTo(0, 0);
  }
  function finish() {
    var tot = Z.res.length, sc = Z.res.filter(function (r) { return r.ok; }).length;
    if (Z.mode === 'full') {
      var b = BAB[S.b], prev = store.best[b.id];
      if (!prev || sc / tot > prev.s / prev.t) store.best[b.id] = { s: sc, t: tot };
      store.wrong[b.id] = Z.res.filter(function (r) { return !r.ok; }).map(function (r) { return r.i; });
    } else {
      Z.res.forEach(function (r) {
        var id = BAB[r.b].id, w = store.wrong[id] || [], k = w.indexOf(r.i);
        if (r.ok && k >= 0) w.splice(k, 1); else if (!r.ok && k < 0) w.push(r.i);

      });
    }

  }

  function hasil() {
    var tot = Z.res.length, sc = Z.res.filter(function (r) { return r.ok; }).length, st = starsFor(sc, tot);
    var lv = { 1: [0, 0], 2: [0, 0], 3: [0, 0] };
    Z.res.forEach(function (r) { var l = BAB[r.b].soalan[r.i].l; lv[l][1]++; if (r.ok) lv[l][0]++; });
    var msg = sc === tot ? 'Sempurna! Semua jawapan betul.' : st === 3 ? 'Cemerlang! Hampir sempurna.' : st === 2 ? 'Bagus! Teruskan berlatih.' : st === 1 ? 'Boleh tahan. Baca nota dan cuba lagi.' : 'Jangan risau. Baca nota, semak soalan salah dan cuba lagi.';
    var h = '<div class="score"><span>' + (Z.mode === 'full' ? esc(BAB[S.b].tajuk) : 'Latihan soalan lemah') + '</span><div class="big">' + sc + '/' + tot + '</div>' + stars(st) + '<p>' + msg + '</p><p style="color:var(--muted)">' + Z.pts + ' mata · jawapan betul berturut terbaik ' + Z.maxStreak + '</p>';
    h += '<div class="break"><div><b>' + lv[1][0] + '/' + lv[1][1] + '</b><span>Rendah</span></div><div><b>' + lv[2][0] + '/' + lv[2][1] + '</b><span>Sederhana</span></div><div><b>' + lv[3][0] + '/' + lv[3][1] + '</b><span>KBAT</span></div></div></div>';
    var wrongN = Z.res.filter(function (r) { return !r.ok; }).length;
    h += '<div class="actions" style="margin-top:14px">';
    if (wrongN) h += '<button class="btn pri" data-act="redo">Cuba semula ' + wrongN + ' soalan salah</button>';
    if (Z.mode === 'full') h += '<button class="btn' + (wrongN ? '' : ' pri') + '" data-act="start">Main semula</button><button class="btn" data-act="tabnota">Baca nota</button>';
    h += '<button class="btn" data-act="menu">Semua bab</button></div>';
    h += '<div class="sec"><h3>Semak jawapan</h3><div class="chips"><button class="chip" data-act="filt" data-f="salah" aria-pressed="' + (rvFilter === 'salah') + '">Salah (' + wrongN + ')</button><button class="chip" data-act="filt" data-f="semua" aria-pressed="' + (rvFilter === 'semua') + '">Semua (' + tot + ')</button></div></div>';
    var list = Z.res.filter(function (r) { return rvFilter === 'semua' || !r.ok; });
    if (!list.length) h += '<div class="empty">Tiada soalan salah. Tahniah!</div>';
    list.forEach(function (r) {
      var q = BAB[r.b].soalan[r.i], n = Z.res.indexOf(r) + 1;
      h += '<article class="rv" style="--h:' + HUE[r.b % HUE.length] + '"><div class="tag"><span>Soalan ' + n + '</span><span class="lv l' + q.l + '">' + LVN[q.l] + '</span><span>Bab ' + BAB[r.b].id + '</span></div>' + fig(q.d) + '<p class="qtext">' + esc(q.q) + '</p><div class="ans">';
      if (!r.ok) h += '<div class="y"><b>Jawapan anda</b>' + (r.pick === -2 ? 'Tiada jawapan (masa tamat)' : esc(q.o[r.pick])) + '</div>';
      h += '<div class="c"><b>Jawapan betul</b>' + esc(q.o[0]) + '</div></div><p class="exp">' + esc(q.e) + '</p></article>';
    });
    app.innerHTML = h;
  }

  /* ---------- Acara ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var a = el.getAttribute('data-act');
    if (a === 'timer') { store.timer = el.checked; save(); return; }
    if (a === 'open') return go('bab', { b: +el.getAttribute('data-i'), tab: 'nota' });
    if (a === 'tab') return go('bab', { tab: el.getAttribute('data-t') });
    if (a === 'tabnota') return go('bab', { tab: 'nota' });
    if (a === 'menu') return go('home');
    if (a === 'quit') return go('bab', { tab: 'kuiz' });
    if (a === 'start') return startQuiz('full');
    if (a === 'startwrong') return startQuiz('wrong');
    if (a === 'weakall') return startWeakAll();
    if (a === 'pick') return answer(+el.getAttribute('data-o'));
    if (a === 'next') return nextQ();
    if (a === 'filt') { rvFilter = el.getAttribute('data-f'); return hasil(); }
    if (a === 'redo') {
      var items = Z.res.filter(function (r) { return !r.ok; }).map(function (r) { return { b: r.b, i: r.i }; });
      var mode = Z.mode === 'full' ? 'wrong' : Z.mode;
      newSession(items, mode); return go('quiz');
    }
  });
  render();
})();

</script>
