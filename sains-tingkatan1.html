SC.push({n:'Pengenalan kepada Penyiasatan Saintifik',nt:[['1.1 Sains dalam kehidupan','Sains ialah kajian tentang alam semula jadi melalui pemerhatian dan penyiasatan. Cabang utama: biologi (hidupan), kimia (bahan), fizik (tenaga dan daya).'],['1.2 Makmal sains','Pakai kot makmal dan cermin mata keselamatan; jangan makan atau berlari. Simbol bahaya: mudah terbakar (api), mengakis, toksik (tengkorak), mudah meletup. Radas: bikar, kelalang kon, silinder penyukat, penunu Bunsen.'],['1.3 Kuantiti fizik dan unit SI','Kuantiti asas: panjang (m), jisim (kg), masa (s), suhu (K), arus elektrik (A). Kuantiti terbitan: luas (m²), isi padu (m³), ketumpatan (kg/m³), halaju (m/s).'],['1.4 Alat pengukur','Pembaris, angkup vernier, tolok skru mikrometer, jam randik, neraca, termometer. Kejituan: hampir dengan nilai sebenar. Kepersisan: bacaan berulang hampir sama. Kepekaan: dapat mengesan perubahan kecil. Ralat paralaks: mata tidak tegak lurus dengan skala.'],['1.5 Ketumpatan','Ketumpatan = jisim ÷ isi padu (g/cm³ atau kg/m³). Air = 1 g/cm³. Objek terapung jika ketumpatannya kurang daripada air. Contoh: 120 g ÷ 40 cm³ = 3 g/cm³.'],['1.6 Penyiasatan saintifik','Langkah: mengenal pasti masalah, hipotesis, merancang eksperimen, mengumpul data, menganalisis, kesimpulan, laporan. Pemboleh ubah: dimanipulasikan (diubah), bergerak balas (diukur), dimalarkan (dikekalkan).'],['1.7 Sikap saintifik','Ingin tahu, jujur dan tepat, sistematik, objektif, tekun, bekerjasama, berfikiran terbuka dan bertanggungjawab.']],
m:['Sains ialah kajian tentang ...|alam semula jadi melalui pemerhatian dan penyiasatan|sejarah negara|perniagaan|sukan sahaja','Cabang sains yang mengkaji hidupan ialah ...|biologi|kimia|fizik|geologi','Simbol bahaya bergambar api menunjukkan bahan ...|mudah terbakar|mengakis|toksik|radioaktif','Simbol bahaya bergambar tengkorak dan tulang bersilang menunjukkan bahan ...|toksik|mudah terbakar|mengakis|oksidan','Peraturan makmal yang betul ialah ...|memakai kot makmal dan cermin mata keselamatan|makan di dalam makmal|berlari di dalam makmal|menghidu bahan kimia secara terus','Alat untuk mengukur isi padu cecair dengan tepat ialah ...|silinder penyukat|bikar|kelalang kon|corong turas','Unit SI bagi jisim ialah ...|kilogram|gram|liter|newton','Unit SI bagi masa ialah ...|saat|minit|jam|hari','Unit SI bagi panjang ialah ...|meter|sentimeter|kilometer|inci','Unit SI bagi suhu ialah ...|kelvin|darjah Celsius|darjah Fahrenheit|joule','Kuantiti terbitan ialah ...|isi padu|jisim|panjang|masa','Alat untuk mengukur ketebalan wayar halus dengan tepat ialah ...|tolok skru mikrometer|pembaris meter|pita pengukur|jam randik','Alat yang sesuai untuk mengukur masa dalam eksperimen pendek ialah ...|jam randik|kalendar|jam dinding|neraca','Kejituan bermaksud ...|bacaan yang hampir dengan nilai sebenar|bacaan yang sama berulang kali|keupayaan mengesan perubahan kecil|kesalahan membaca skala','Kepersisan bermaksud ...|bacaan yang hampir sama apabila diulang|bacaan hampir dengan nilai sebenar|keupayaan mengesan perubahan kecil|ralat sifar','Kepekaan sesuatu alat ialah ...|keupayaan mengesan perubahan yang kecil|kejituan bacaan|kebolehulangan bacaan|ketahanan alat','Ralat paralaks berlaku apabila ...|mata tidak tegak lurus dengan skala bacaan|alat berkarat|skala bermula daripada sifar|isi padu terlalu banyak','Rumus ketumpatan ialah ...|jisim ÷ isi padu|isi padu ÷ jisim|jisim × isi padu|jisim + isi padu','Blok berjisim 120 g dan berisi padu 40 cm³. Ketumpatannya ialah ...|3 g/cm³|0.33 g/cm³|80 g/cm³|4800 g/cm³','Objek terapung dalam air jika ketumpatannya ...|kurang daripada ketumpatan air|lebih daripada ketumpatan air|sama dengan jisimnya|sangat tinggi','Pemboleh ubah yang diubah oleh penyiasat dinamakan pemboleh ubah ...|dimanipulasikan|bergerak balas|dimalarkan|tidak berubah','Pemboleh ubah yang diukur atau diperhatikan dinamakan pemboleh ubah ...|bergerak balas|dimanipulasikan|dimalarkan|dimasukkan','Pemboleh ubah yang dikekalkan sama dalam eksperimen ialah pemboleh ubah ...|dimalarkan|dimanipulasikan|bergerak balas|dihipotesiskan','Pernyataan yang boleh diuji tentang hubungan antara pemboleh ubah ialah ...|hipotesis|kesimpulan|inferens|pemerhatian','Langkah selepas mengumpul data ialah ...|menganalisis dan mentafsir data|membuat hipotesis|mengenal pasti masalah|merancang eksperimen','Murid yang merekod data dengan jujur menunjukkan sikap ...|jujur dan tepat|ingin tahu|bekerjasama|berfikiran terbuka'],
s:['Namakan unit SI bagi isi padu.|meter padu;m3;m³','Hitung ketumpatan blok berjisim 90 g dan berisi padu 30 cm³ (taip nombor g/cm³).|3','Nyatakan satu peraturan keselamatan di makmal.|kot;cermin mata;tidak makan;jangan makan;tidak berlari;basuh tangan;sarung tangan;lapor;guru','Alat apakah yang sesuai untuk mengukur diameter sebiji guli dengan tepat?|angkup;vernier;mikrometer;tolok skru','Namakan ralat apabila mata tidak tegak lurus dengan skala bacaan.|paralaks','Dalam eksperimen kesan suhu terhadap kadar pelarutan gula, apakah pemboleh ubah dimanipulasikan?|suhu','Dalam eksperimen yang sama, apakah pemboleh ubah bergerak balas?|masa;kadar pelarutan;pelarutan','Nyatakan satu pemboleh ubah dimalarkan dalam eksperimen kesan suhu terhadap pelarutan gula.|isi padu;jisim;saiz;air','Apakah langkah pertama dalam penyiasatan saintifik?|mengenal pasti masalah;masalah;pemerhatian','Namakan satu sikap saintifik.|ingin tahu;jujur;tepat;sistematik;objektif;tekun;bekerjasama;berfikiran terbuka;bertanggungjawab'],

SC.push({n:'Sel sebagai Unit Asas Hidupan',nt:[['2.1 Struktur dan fungsi sel','Sel haiwan: membran sel (mengawal keluar masuk bahan), sitoplasma (tindak balas kimia), nukleus (mengawal aktiviti sel), mitokondrion (respirasi). Sel tumbuhan ada tambahan dinding sel (bentuk tetap dan sokongan), kloroplas (fotosintesis) dan vakuol besar (menyimpan air).'],['Organisasi sel','Sel → tisu → organ → sistem organ → organisma. Unisel: Amoeba. Multisel: manusia. Pembesaran mikroskop = pembesaran kanta mata × kanta objektif.'],['2.2 Respirasi sel','Glukosa + oksigen → karbon dioksida + air + tenaga. Berlaku di mitokondrion dalam semua sel hidup.'],['Fotosintesis','Karbon dioksida + air → glukosa + oksigen (dengan cahaya dan klorofil). Berlaku di kloroplas. Ujian kanji: larutan iodin. Ujian karbon dioksida: air kapur menjadi keruh.']],

adiran kanji dalam daun ialah ...|larutan iodin|air kapur|kertas kobalt klorida|larutan Benedict','Air kapur menjadi keruh apabila dialirkan gas ...|karbon dioksida|oksigen|nitrogen|hidrogen','Vakuol dalam sel tumbuhan matang berfungsi untuk ...|menyimpan air dan bahan terlarut|menghasilkan tenaga|mengawal nukleus|menghasilkan klorofil','Sel yang diubah suai untuk fungsi tertentu dinamakan ...|sel khusus|sel mati|sel unisel|sel kanser'],
s:['Namakan organel tempat fotosintesis berlaku.|kloroplas','Namakan organel tempat respirasi sel berlaku.|mitokondrion;mitokondria','Namakan satu organel dalam sel tumbuhan yang tiada dalam sel haiwan.|dinding sel;kloroplas;vakuol','Namakan satu organisma unisel.|amoeba;paramecium;euglena;yis;bakteria','Apakah organel yang mengawal aktiviti sel?|nukleus','Namakan gas yang dibebaskan semasa respirasi sel.|karbon dioksida','Namakan gas yang digunakan semasa respirasi sel.|oksigen','Apakah bahan yang digunakan untuk menguji kehadiran kanji dalam daun?|iodin','Sekumpulan sel yang sama jenis dan fungsi dinamakan apa?|tisu'],

SC.push({n:'Koordinasi dan Gerak Balas',nt:[['3.1 Homeostasis','Homeostasis ialah mengekalkan keadaan dalaman badan yang stabil, contohnya suhu badan (kira-kira 37 °C) dan paras glukosa darah.'],['Pengawalaturan suhu badan','Hipotalamus mengesan suhu. Suhu naik: berpeluh dan vasodilasi (salur darah mengembang). Suhu turun: menggigil dan vasokonstriksi (salur darah mengecut).'],['Glukosa dan ginjal','Insulin (dari pankreas) menurunkan paras glukosa darah. Ginjal membuang lebihan air dan sisa dalam air kencing.'],['Gerak balas tumbuhan','Fototropisme positif: pucuk ke arah cahaya. Geotropisme positif: akar ke arah graviti. Hidrotropisme positif: akar ke arah air. Tigmotropisme: gerak balas kepada sentuhan.']],

s:['Namakan bahagian otak yang mengawal suhu badan.|hipotalamus','Apakah suhu badan normal manusia? (taip nombor °C)|37','Namakan hormon yang menurunkan paras glukosa darah.|insulin','Namakan organ yang menghasilkan insulin.|pankreas','Nyatakan satu tindakan badan apabila suhu badan meningkat.|berpeluh;peluh;vasodilasi','Nyatakan satu tindakan badan apabila suhu badan menurun.|menggigil;vasokonstriksi','Namakan proses mengekalkan keadaan dalaman badan yang stabil.|homeostasis','Namakan organ yang membuang lebihan air dan sisa dalam air kencing.|ginjal'],

SC.push({n:'Pembiakan',nt:[['4.1 Pembiakan seks dan aseks','Aseks: satu induk, anak serupa (belahan dedua, percambahan, regenerasi). Seks: dua induk, gamet bercantum, anak berbeza.'],['4.2 Sistem pembiakan manusia','Lelaki: testis menghasilkan sperma dan testosteron. Perempuan: ovari menghasilkan ovum, tiub Fallopio, uterus, serviks dan faraj.'],['4.3 Kitar haid','Purata 28 hari. Ovulasi kira-kira hari ke-14. Jika tiada persenyawaan, dinding uterus runtuh dan berlaku haid. Jaga kebersihan diri.'],['4.4 Persenyawaan dan kehamilan','Sperma + ovum di tiub Fallopio → zigot → embrio → implantasi pada dinding uterus. Plasenta dan tali pusat membekalkan nutrien. Kehamilan kira-kira 9 bulan. Kembar seiras: satu zigot membahagi. Kembar tak seiras: dua ovum.'],['4.5 dan 4.6 Faktor dan kesihatan','Pemakanan seimbang, asid folik dan pemeriksaan doktor membantu fetus. Merokok, alkohol, dadah dan penyakit membahayakan fetus. Kemandulan ada pelbagai punca dan boleh dirawat. Bincangkan kaedah pencegahan kehamilan dengan ibu bapa atau doktor.'],['4.7 Pembiakan tumbuhan','Pendebungaan: debunga dari anter ke stigma (angin, serangga). Persenyawaan menghasilkan biji benih. Biji disebar oleh angin, air, haiwan atau letupan. Pembiakan vegetatif: ubi kentang, stolon, keratan batang.']],

SC.push({n:'Jirim',nt:[['5.1 Jirim','Jirim mempunyai jisim dan memenuhi ruang. Zarah jirim: atom (unit asas), molekul (dua atau lebih atom), ion (atom bercas).'],['5.2 Tiga keadaan jirim','Pepejal: zarah rapat dan teratur, bergetar, bentuk dan isi padu tetap. Cecair: rapat tidak teratur, bergerak, isi padu tetap. Gas: jauh dan bebas bergerak, boleh dimampatkan.'],['Perubahan keadaan','Peleburan (pepejal → cecair), pembekuan (cecair → pepejal), pengewapan (cecair → gas), kondensasi (gas → cecair), pemejalwapan (pepejal → gas). Takat lebur ais 0 °C, takat didih air 100 °C. Suhu tetap semasa perubahan keadaan.'],['Resapan','Zarah bergerak dari kepekatan tinggi ke rendah. Paling cepat dalam gas.']],

SC.push({n:'Jadual Berkala',nt:[['6.1 Pengelasan unsur','Unsur disusun mengikut nombor proton dalam Jadual Berkala. Lajur menegak: kumpulan. Baris mengufuk: kala. Logam: berkilat, mulur, konduktor. Bukan logam: kusam, rapuh, penebat. Kumpulan 1: logam alkali; kumpulan 17: halogen; kumpulan 18: gas adi (tidak reaktif).'],['Simbol unsur','H hidrogen, He helium, C karbon, N nitrogen, O oksigen, Na natrium, Mg magnesium, Al aluminium, S sulfur, Cl klorin, K kalium, Ca kalsium, Fe besi, Cu kuprum, Zn zink.'],['6.2 Campuran','Bahan bercampur tanpa tindak balas kimia. Diasingkan secara fizikal: penurasan, penyejatan, penyulingan, kromatografi, magnet, pengayakan.'],['6.3 Sebatian','Unsur bergabung secara kimia dalam nisbah tetap. Sifat berbeza daripada unsur asal dan diasingkan secara kimia. Contoh: air (H₂O), karbon dioksida (CO₂), garam (NaCl).']],

s:['Namakan satu logam.|besi;kuprum;aluminium;emas;perak;zink;magnesium;natrium;plumbum;timah','Namakan satu bukan logam.|karbon;oksigen;nitrogen;sulfur;klorin;hidrogen;fosforus;helium;neon','Apakah simbol bagi unsur karbon?|c','Namakan kaedah mengasingkan pepejal tak larut daripada cecair.|penurasan','Namakan kaedah mengasingkan garam daripada larutan garam.|penyejatan;penghabluran','Namakan kumpulan 18 dalam Jadual Berkala.|gas adi','Namakan lajur menegak dalam Jadual Berkala.|kumpulan','Apakah formula kimia bagi karbon dioksida?|co2;co₂'],

SC.push({n:'Udara',nt:[['7.1 Komposisi udara','Nitrogen kira-kira 78%, oksigen 21%, karbon dioksida 0.04%, gas adi dan wap air. Ujian oksigen: kayu uji berbara menyala. Ujian karbon dioksida: air kapur menjadi keruh.'],['7.2 Pembakaran','Segi tiga api: bahan api, oksigen, haba. Padamkan api dengan menyingkirkan salah satu. Pembakaran lengkap: karbon dioksida dan air. Tidak lengkap: karbon monoksida (toksik) dan jelaga.'],['7.3 Pencemaran udara','Bahan pencemar: karbon monoksida, sulfur dioksida, nitrogen dioksida, partikulat, CFC. Kesan: hujan asid, kesan rumah hijau dan pemanasan global, jerebu, penipisan ozon. Langkah: pengangkutan awam, tanam pokok, elak pembakaran terbuka.']],

s:['Namakan gas yang paling banyak dalam udara.|nitrogen','Nyatakan peratus oksigen dalam udara. (taip nombor)|21','Apakah ujian untuk gas oksigen?|kayu uji berbara;kayu berbara;berbara','Apakah ujian untuk gas karbon dioksida?|air kapur','Namakan satu komponen segi tiga api.|bahan api;oksigen;haba','Namakan gas toksik yang dihasilkan oleh pembakaran tidak lengkap.|karbon monoksida','Namakan satu gas yang menyebabkan hujan asid.|sulfur dioksida;nitrogen dioksida','Nyatakan satu langkah mengurangkan pencemaran udara.|pengangkutan awam;kitar semula;tanam pokok;elak bakar;tenaga bersih'],

SC.push({n:'Cahaya dan Optik',nt:[['8.1 Penggunaan cermin','Cermin cembung: medan penglihatan luas (cermin sisi kenderaan). Cermin cekung: membesarkan imej (cermin doktor gigi). Cermin satah: imej maya, sama saiz dan songsang sisi.'],['8.2 Sifat cahaya','Cahaya bergerak dalam garis lurus. Bahan lutsinar membenarkan semua cahaya lalu, lut sinar sebahagian, legap tidak membenarkan. Bayang-bayang terbentuk apabila cahaya dihalang bahan legap.'],['8.3 Pantulan cahaya','Hukum pantulan: sudut tuju = sudut pantulan. Normal berserenjang dengan permukaan. Jarak imej = jarak objek dalam cermin satah.'],['8.4 Pembiasan cahaya','Cahaya dibiaskan apabila melalui medium berbeza ketumpatan optik. Udara ke air: mendekati normal. Air ke udara: menjauhi normal. Contoh: pensel kelihatan bengkok, kolam kelihatan cetek.'],['8.5 Penyebaran cahaya','Prisma menguraikan cahaya putih kepada merah, jingga, kuning, hijau, biru, nila, ungu. Pelangi terbentuk oleh penyebaran cahaya melalui titisan hujan.'],['8.6 Penyerakan cahaya','Zarah di atmosfera menyerakkan cahaya. Cahaya biru paling banyak diserakkan, jadi langit biru. Ketika matahari terbenam cahaya biru diserakkan keluar dan cahaya merah sampai ke mata.'],['8.7 Penambahan dan penolakan cahaya','Warna primer cahaya: merah, hijau, biru. Merah + hijau = kuning; merah + biru = magenta; hijau + biru = sian; ketiga-tiga = putih. Warna primer pigmen: sian, magenta, kuning. Objek berwarna memantulkan warnanya dan menyerap warna lain.']],

SC.push({n:'Bumi',nt:[['9.1 Sistem dan struktur Bumi','Sistem Bumi: atmosfera (gas), hidrosfera (air), litosfera (batuan), biosfera (hidupan). Struktur: kerak, mantel, teras luar (cecair), teras dalam (pepejal). Lapisan atmosfera: troposfera, stratosfera (ada lapisan ozon), mesosfera, termosfera.'],['9.2 Bahan Bumi','Batuan igneus: pemejalan magma atau lava (granit, basalt). Batuan sedimen: pemendapan dan pemadatan (batu pasir, batu kapur). Batuan metamorf: haba dan tekanan tinggi (marmar).'],['9.3 Proses utama Bumi','Luluhawa: batuan hancur oleh cuaca. Hakisan: bahan diangkut oleh air, angin atau ais. Pergerakan plat tektonik menyebabkan gempa bumi dan gunung berapi.'],['9.4 Geobencana','Gempa bumi, gunung berapi, tsunami, tanah runtuh. Seismograf mengukur gegaran. Semasa gempa bumi, berlindung di bawah meja kukuh dan jauhi tingkap.'],['9.5 Usia Bumi','Bumi berusia kira-kira 4.6 bilion tahun. Fosil ialah sisa hidupan purba dalam batuan dan membantu mengkaji sejarah Bumi.'],['9.6 Sumber Bumi','Sumber: air, mineral, bahan api fosil (petroleum, arang batu, gas asli) dan bahan binaan. Gunakan secara lestari supaya generasi akan datang juga dapat menggunakannya.']],

s:['Namakan lapisan paling luar Bumi.|kerak','Namakan satu jenis batuan.|igneus;sedimen;metamorf','Namakan batuan yang terbentuk daripada pemejalan lava atau magma.|igneus','Namakan alat yang mengukur gegaran gempa bumi.|seismograf','Berapakah usia Bumi dalam bilion tahun? (taip nombor)|4.6','Namakan satu bahan api fosil.|petroleum;arang batu;gas asli;minyak','Namakan lapisan atmosfera yang mengandungi lapisan ozon.|stratosfera','Namakan satu contoh geobencana.|gempa bumi;tsunami;gunung berapi;tanah runtuh;banjir'],

var nm=s=>String(s).trim().toLowerCase().replace(/\s+/g,' ');
function okkw(v,kw){var n=nm(v);return kw.some(k=>/^\d+(\.\d+)?$/.test(k)?new RegExp('(^|[^0-9.])'+k.replace('.','\\.')+'([^0-9]|$)').test(n):k.length<=2?n==k:n.indexOf(k)>-1)}
function build(b){var d=SC[b-1],M=sh(d.m).slice(0,20).map(s=>{var p=s.split('|');return{t:'m',q:p[0],a:p[1],o:sh(p.slice(1))}}),S=sh(d.s).slice(0,8).map(s=>{var p=s.split('|'),k=p[1].split(';');return{t:'s',q:p[0],kw:k,a:k.slice(0,3).join(' / ')}}),E=sh(d.e).slice(0,2).map(x=>({t:'e',q:x[0],pts:x[1]}));return M.concat(S,E)}

var A=document.getElementById('app'),C={},tm=s=>Math.floor(s/60)+'m '+s%60+'s';

var HOME='https://leykaeducation.github.io/portal-pembeli/';

    h+='<div class="card un"><div class="tx"><b>Bab '+u+'</b> '+e(d.n)+'<small>'+(l.length?l.length+' cubaan · Terbaik '+b+'/30':'Belum dimain')+'</small></div><div class="bt"><button class="b5" onclick="nt('+u+')">📘</button><button onclick="go('+u+')">▶️</button><button class="b3" onclick="hist('+u+')">📒</button></div></div>'});

  if(q.t=='m')h+='<div class="card q">'+e(q.q)+'</div><div class="ans">'+q.o.map((o,i)=>'<button onclick="pk('+i+')">'+e(o)+'</button>').join('')+'</div><div id="fb"></div>';
