function pool(k){var o=[];
  if(k.charAt(0)=='J'){var cs=k.indexOf(':')>0?k.split(':')[1].split(','):Object.keys(CN);cs.forEach(c=>JW[c].forEach(w=>o.push({q:'Perkataan “'+w+'” ialah ...',a:CN[c],w:sh(Object.keys(CN).filter(x=>x!=c)).slice(0,3).map(x=>CN[x]),x:DEF[c]})))}
  else if(k=='K')KG.forEach(g=>sp(g[1]).forEach(w=>o.push({q:'Kata ganda “'+w+'” ialah kata ganda ...',a:g[0],w:['penuh','separa','berentak','berimbuhan'].filter(x=>x!=g[0]),x:'Penuh: seluruh kata diulang. Separa: sebahagian kata diulang. Berentak: bunyi hampir sama. Berimbuhan: ada imbuhan.'})));
  else if(k=='A')ADL.forEach(p=>o.push({q:'Ayat “'+p[0]+'” ialah pola ayat dasar ...',a:p[1],w:['FN + FN','FN + FK','FN + FA','FN + FS'].filter(x=>x!=p[1]),x:NOTE.A}));
  else if(k=='F')FRL.forEach(g=>g[1].split('|').forEach(w=>o.push({q:'Frasa “'+w+'” ialah ...',a:g[0],w:FRL.map(x=>x[0]).filter(x=>x!=g[0]),x:NOTE.F})));
  else if(k=='S'){S_ST.forEach(x=>o.push(x));SY.forEach(p=>o.push({q:'Sinonim (kata seerti) bagi “'+p[0]+'” ialah ...',a:p[1],w:sh(SY.filter(x=>x!=p)).slice(0,3).map(x=>x[1])}));AN.forEach(p=>o.push({q:'Antonim (kata berlawan) bagi “'+p[0]+'” ialah ...',a:p[1],w:sh(AN.filter(x=>x!=p)).slice(0,3).map(x=>x[1])}))}
  else o=({P:P_ST,W:W_ST,E:E_ST,I:I_ST})[k].slice();
  return o}
function build(u){var sk=UN[u-1][1].split(' '),own=[],all=[],seen={},out=[];
  sk.forEach(k=>{own=own.concat(pool(k))});
  ['J','K','I','A','F','S','P','W','E'].forEach(k=>{all=all.concat(pool(k))});
  sh(own).concat(sh(all)).forEach(x=>{if(out.length<30&&!seen[x.q]){seen[x.q]=1;out.push({q:x.q,a:x.a,o:sh([x.a].concat(x.w)),x:x.x||''})}});
  return out}
function nota(u){var h='';UN[u-1][1].split(' ').forEach(k=>{if(k.charAt(0)=='J')(k.indexOf(':')>0?k.split(':')[1].split(','):[]).forEach(c=>{h+='<p>'+e(DEF[c])+'</p>'});else h+='<p>'+e(NOTE[k])+'</p>'});return h}
var H={};try{H=JSON.parse(localStorage.getItem('bm1_v1'))||{}}catch(x){}
var A=document.getElementById('app'),C={},tm=s=>Math.floor(s/60)+'m '+s%60+'s';
var ac;function snd(f,d,t){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=.1;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(x){}}
var HOME='https://leykaeducation.github.io/portal-pembeli/';
function menu(){var h='<button class="bk" style="align-self:flex-start" onclick="location.href=HOME">🏠 Halaman Utama </button><div class="card"><div class="big">📚</div><h1>Bahasa Melayu Tingkatan 1</h1><p>36 unit. Baca nota ringkas, kemudian cuba 30 soalan. Tekan 📘 nota, ▶️ main, 📒 sejarah.</p></div>';
  UN.forEach((t,i)=>{var u=i+1;if(u%2)h+='<div class="tm">Tema '+((u+1)/2)+': '+TM[(u-1)/2]+'</div>';var l=H[u]||[],b=l.reduce((m,x)=>Math.max(m,x.s),0);
    h+='<div class="card un"><div class="tx"><b>Unit '+u+'</b> '+t[0]+'<small>'+(l.length?l.length+' cubaan · Terbaik '+b+'/30':'Belum dimain')+'</small></div><div class="bt"><button class="b5" onclick="nt('+u+')">📘</button><button onclick="go('+u+')">▶️</button><button class="b3" onclick="hist('+u+')">📒</button></div></div>'});
  A.innerHTML=h;scrollTo(0,0)}
function nt(u){A.innerHTML='<button class="bk" onclick="menu()">⬅️ Kembali</button><div class="card"><p>Tema '+Math.ceil(u/2)+': '+TM[Math.ceil(u/2)-1]+'</p><h2>Unit '+u+': '+UN[u-1][0]+'</h2></div><div class="card nt"><b>📘 Nota Ringkas</b>'+nota(u)+'</div><button class="b4" onclick="go('+u+')">▶️ Mula 30 Soalan</button>';scrollTo(0,0)}
function go(u){C={u:u,q:build(u),i:0,s:0,t0:Date.now(),w:[]};show()}
function show(){if(C.i>=C.q.length)return end();var q=C.q[C.i];C.lock=0;
  A.innerHTML='<div class="top"><button class="bk" onclick="menu()">⬅️</button><span>Unit '+C.u+'</span><span>'+(C.i+1)+'/'+C.q.length+'</span><span>⭐ '+C.s+'</span></div><div class="bar"><i style="width:'+C.i/C.q.length*100+'%"></i></div><div class="card q">'+e(q.q)+'</div><div class="ans">'+q.o.map((o,i)=>'<button onclick="pk('+i+')">'+e(o)+'</button>').join('')+'</div><div id="fb"></div>';scrollTo(0,0)}
function pk(i){if(C.lock)return;C.lock=1;var q=C.q[C.i],ok=q.o[i]==q.a,bs=document.querySelectorAll('.ans button');
  bs.forEach((b,j)=>{if(q.o[j]==q.a)b.classList.add('ok')});
  if(ok){C.s++;snd(660,.15)}else{bs[i].classList.add('no','sh');C.w.push(q);snd(200,.3,'square')}
  var fb=document.getElementById('fb');
  fb.innerHTML='<div class="fb"><b>'+(ok?'Betul! 🎉':'Belum tepat 💪 Jawapan: '+e(q.a))+'</b>'+(q.x?'<br>📝 '+e(q.x):'<br>📝 Ulang kaji nota Unit '+C.u+' dengan menekan 📘 di senarai unit.')+'</div><button class="nx" onclick="C.i++;show()">'+(C.i+1>=C.q.length?'Lihat Keputusan 🏁':'Seterusnya ➡️')+'</button>';
  fb.scrollIntoView({behavior:'smooth',block:'end'})}
function end(){var n=C.q.length,sec=Math.round((Date.now()-C.t0)/1000),r=C.s/n,st=r>=.9?3:r>=.65?2:r>=.4?1:0;
  H[C.u]=[{t:Date.now(),s:C.s,n:n,sec:sec}].concat(H[C.u]||[]).slice(0,30);try{localStorage.setItem('bm1_v1',JSON.stringify(H))}catch(x){}
  snd(st>1?880:300,.4);
  A.innerHTML='<div class="card"><div class="big">'+(st>1?'🏆':'📖')+'</div><h1>Unit '+C.u+' Selesai!</h1><div class="st">'+'⭐'.repeat(st)+'☆'.repeat(3-st)+'</div><p>Markah: <b>'+C.s+'/'+n+'</b> ('+Math.round(r*100)+'%) · Masa '+tm(sec)+'</p></div>'
  +(C.w.length?'<div class="card"><b>Semak soalan yang salah ('+C.w.length+')</b>'+C.w.map(q=>'<div class="row"><span>❌</span><span>'+e(q.q)+'<br><b>Jawapan: '+e(q.a)+'</b></span></div>').join('')+'</div>':'')
  +'<button class="b4" onclick="go('+C.u+')">🔁 Main Semula</button><button class="b5" onclick="nt('+C.u+')">📘 Nota Unit '+C.u+'</button><button class="b3" onclick="hist('+C.u+')">📒 Sejarah Unit '+C.u+'</button><button onclick="menu()">🏠 Senarai Unit</button><button style="background:#e8507a" onclick="location.href=HOME">🏠 Halaman Utama (subjek lain)</button>';scrollTo(0,0)}
function hist(u){var l=H[u]||[],b=l.reduce((m,x)=>Math.max(m,x.s),0),av=l.length?Math.round(l.reduce((m,x)=>m+x.s/x.n,0)/l.length*100):0;
  var h='<button class="bk" onclick="menu()">⬅️ Kembali</button><div class="card"><h2>📒 Sejarah Unit '+u+'</h2><p>'+UN[u-1][0]+'</p><p>'+l.length+' cubaan · Terbaik '+b+'/30 · Purata '+av+'%</p></div>';
  if(!l.length)h+='<div class="card"><p>Belum ada aktiviti untuk unit ini. Jom cuba! 🚀</p></div>';
  else h+='<div class="card"><b>Cubaan terkini</b>'+l.map((x,i)=>'<div class="row"><span style="flex:1">'+(i?'':'🆕 ')+new Date(x.t).toLocaleString('ms-MY',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'<br><b>'+x.s+'/'+x.n+'</b> ('+Math.round(x.s/x.n*100)+'%) · '+tm(x.sec)+'<div class="pb"><i style="width:'+x.s/x.n*100+'%"></i></div></span></div>').join('')+'</div>';
  A.innerHTML=h+'<button class="b4" onclick="go('+u+')">▶️ Main Unit '+u+'</button>';scrollTo(0,0)}
(function(){var f=document.createElement('div');f.id='fx';var E=['📚','✏️','⭐','🖍️','✨','📖','🌸','🎈'];for(var i=0;i<14;i++){var s=document.createElement('span');s.textContent=E[i%E.length];s.style.cssText='left:'+Math.random()*95+'%;font-size:'+(20+Math.random()*24)+'px;animation-duration:'+(14+Math.random()*14)+'s;animation-delay:-'+Math.random()*20+'s';f.appendChild(s)}document.body.prepend(f)})();
menu();
</script>
</body>
</html>
