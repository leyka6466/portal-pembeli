var R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,P=a=>a[R(0,a.length-1)],sh=a=>a.slice().sort(()=>Math.random()-.5);
var gcd=(a,b)=>b?gcd(b,a%b):a,lcm=(a,b)=>a/gcd(a,b)*b,f=n=>n<0?'('+n+')':''+n,sg=n=>(n<0?'− ':'+ ')+Math.abs(n);
var fr=(n,d)=>{var g=gcd(Math.abs(n),d);n/=g;d/=g;return d==1?''+n:n+'/'+d};
var pf=n=>{var r=[],p=2;while(n>1){while(n%p==0){r.push(p);n/=p}p++}return r};
var fc=n=>{var r=[];for(var i=1;i<=n;i++)if(n%i==0)r.push(i);return r};
var rg=(a,b)=>{var r=[];for(var i=a;i<=b;i++)r.push(i);return r},asc=a=>a.sort((x,y)=>x-y),ss=a=>a.length?'{'+a.join(', ')+'}':'{ }';
var nz=(a,b)=>{var v=0;while(!v)v=R(a,b);return v};
var poly=t=>{var s='';t.forEach(e=>{var c=e[0],v=e[1];if(!c)return;var a=Math.abs(c);s+=(s?(c<0?' − ':' + '):(c<0?'−':''))+((a==1&&v)?'':a)+v});return s||'0'};
var OPS=['<','>','≤','≥'],FL={'<':'>','>':'<','≤':'≥','≥':'≤'},ow=(v,op)=>OPS.filter(o=>o!=op).map(o=>'x '+o+' '+v);
var TR=[[3,4,5],[5,12,13],[8,15,17],[7,24,25]],tr=()=>{var k=R(1,3);return P(TR).map(v=>v*k)};
var fd=()=>{var n=sh(['Merah','Biru','Hijau','Kuning','Ungu','Oren']).slice(0,4),q=sh(rg(2,12)).slice(0,4);return{n:n,q:q,t:n.map((x,i)=>x+' '+q[i]).join(', ')}};
var TT=['Nombor Nisbah','Faktor dan Gandaan','Kuasa Dua, Punca Kuasa Dua, Kuasa Tiga dan Punca Kuasa Tiga','Nisbah, Kadar dan Kadaran','Ungkapan Algebra','Persamaan Linear','Ketaksamaan Linear','Garis dan Sudut','Poligon Asas','Perimeter dan Luas','Pengenalan Set','Pengendalian Data','Teorem Pythagoras'];

var GEN={
1:[
()=>{var a=R(-15,15),b=R(-15,15),c=R(-15,15),r=a+b-c;return[`Hitung ${a} + ${f(b)} − ${f(c)}.`,r,[`${a} + ${f(b)} = ${a+b}`,`Tolak negatif = tambah positif: ${a+b} − ${f(c)} = ${r}`]]},
()=>{var c=R(2,6),a=c*R(1,4)*P([1,-1]),b=R(2,7)*P([1,-1]),p=a*b;return[`Hitung ${f(a)} × ${f(b)} ÷ ${c}.`,p/c,['Tanda sama → positif, tanda beza → negatif',`${f(a)} × ${f(b)} = ${p}`,`${p} ÷ ${c} = ${p/c}`]]},
()=>{var L=[2,3,4,5,6,8,9],b=P(L),d=b;while(d==b)d=P(L);var a=R(1,b-1),c=R(1,d-1),l=lcm(b,d),x=a*l/b,y=c*l/d,n=x+y,r=fr(n,l);return[`Hitung ${a}/${b} + ${c}/${d}.`,r,[`GSTK ${b} dan ${d} = ${l}`,`${a}/${b} = ${x}/${l} dan ${c}/${d} = ${y}/${l}`,`${x}/${l} + ${y}/${l} = ${n}/${l}`,`Permudahkan: ${r}`],[fr(a+c,b+d),fr(n+1,l),fr(n-1,l),fr(n,l+1)]]},
()=>{var L=[2,3,4,5,6,8,9],a,b,c,d,l,x,y;do{b=P(L);d=P(L);a=R(1,b-1);c=R(1,d-1);l=lcm(b,d);x=a*l/b;y=c*l/d}while(b==d||x<=y);var n=x-y,r=fr(n,l);return[`Hitung ${a}/${b} − ${c}/${d}.`,r,[`GSTK ${b} dan ${d} = ${l}`,`${a}/${b} = ${x}/${l} dan ${c}/${d} = ${y}/${l}`,`${x}/${l} − ${y}/${l} = ${n}/${l}`,`Permudahkan: ${r}`],[fr(Math.abs(a-c),Math.abs(b-d)),fr(n+1,l),fr(n-1,l),fr(n,l+1)]]},
()=>{var x=R(12,95),y=R(2,9),p=x*y;return[`Hitung ${x/10} × 0.${y}.`,+(p/100).toFixed(2),[`Abaikan titik perpuluhan: ${x} × ${y} = ${p}`,'Jumlah tempat perpuluhan = 1 + 1 = 2',`${p} → ${+(p/100).toFixed(2)}`]]},
()=>{var x=R(-95,95),y=R(-95,95);return[`Hitung ${x/10} + ${f(y/10)}.`,(x+y)/10,[`Darab 10: ${x} + ${f(y)} = ${x+y}`,`${x+y} ÷ 10 = ${(x+y)/10}`]]}],
2:[
()=>{var g=R(2,9),p=R(2,8),q=R(2,8),a=g*p,b=g*q;if(a==b)b+=g;var h=gcd(a,b);return[`Cari FSTB bagi ${a} dan ${b}.`,h,[`Faktor ${a}: ${fc(a).join(', ')}`,`Faktor ${b}: ${fc(b).join(', ')}`,`Faktor sepunya terbesar = ${h}`]]},
()=>{var a=R(4,16),b=a;while(b==a)b=R(4,16);var l=lcm(a,b);return[`Cari GSTK bagi ${a} dan ${b}.`,l,[`${a} = ${pf(a).join(' × ')}`,`${b} = ${pf(b).join(' × ')}`,'Ambil semua faktor perdana dengan kuasa tertinggi',`GSTK = ${l}`]]},
()=>{var n=P([R(6,60)*2,R(4,40)*3]),m=n,s=[];pf(n).forEach(p=>{s.push(`${m} ÷ ${p} = ${m/p}`);m/=p});var r=pf(n).join(' × ');return[`Ungkapkan ${n} sebagai hasil darab faktor perdana.`,r,s.concat(`${n} = ${r}`),[n+2,n-2,n+4].map(v=>pf(v).join(' × '))]},
()=>{var n=R(11,97),ok=pf(n).length==1;return[`Adakah ${n} nombor perdana?`,ok?'Ya':'Tidak',ok?[`${n} hanya boleh dibahagi dengan 1 dan ${n}`]:[`${n} = ${pf(n).join(' × ')}`,'Ada faktor lain selain 1 dan dirinya, jadi bukan perdana'],[ok?'Tidak':'Ya']]},
()=>{var a=R(4,12),b=a;while(b==a)b=R(4,12);var l=lcm(a,b);return[`Dua lampu berkelip setiap ${a} saat dan ${b} saat. Jika berkelip serentak sekarang, selepas berapa saat lagi ia berkelip serentak?`,l,[`Cari GSTK bagi ${a} dan ${b}`,`${a} = ${pf(a).join(' × ')}, ${b} = ${pf(b).join(' × ')}`,`GSTK = ${l}`],0,' saat']},
()=>{var g=R(2,8),p=R(2,7),q=R(2,7),a=g*p,b=g*q;if(a==b)b+=g;var h=gcd(a,b);return[`Terdapat ${a} pen dan ${b} buku. Semuanya dibahagi sama banyak ke dalam beberapa beg tanpa baki. Berapakah bilangan beg maksimum?`,h,[`Cari FSTB bagi ${a} dan ${b}`,`Faktor ${a}: ${fc(a).join(', ')}`,`Faktor ${b}: ${fc(b).join(', ')}`,`FSTB = ${h}`],0,' beg']}],
3:[
()=>{var n=R(11,25);return[`Hitung ${n}².`,n*n,[`${n}² = ${n} × ${n}`,`= ${n*n}`]]},
()=>{var n=R(5,30);return[`Hitung √${n*n}.`,n,[`Cari nombor yang apabila didarab dengan dirinya = ${n*n}`,`${n} × ${n} = ${n*n}`,`√${n*n} = ${n}`]]},
()=>{var n=R(2,12);return[`Hitung ${n}³.`,n**3,[`${n}³ = ${n} × ${n} × ${n}`,`${n} × ${n} = ${n*n}`,`${n*n} × ${n} = ${n**3}`]]},
()=>{var n=R(2,12);return[`Hitung ∛${n**3}.`,n,[`Cari nombor yang didarab 3 kali = ${n**3}`,`${n} × ${n} × ${n} = ${n**3}`,`∛${n**3} = ${n}`]]},
()=>{var x=R(3,12),y=R(2,6),z=R(1,30),r=x+y**3-z;return[`Hitung √${x*x} + ${y}³ − ${z}.`,r,[`√${x*x} = ${x}`,`${y}³ = ${y**3}`,`${x} + ${y**3} − ${z} = ${r}`]]},
()=>{var s=R(4,20);return[`Luas sebuah segi empat sama ialah ${s*s} cm². Berapakah panjang sisinya?`,s,['Luas = sisi²',`Sisi = √${s*s} = ${s}`],0,' cm']},
()=>{var s=R(2,9);return[`Sebuah kubus mempunyai sisi ${s} cm. Hitung isi padunya.`,s**3,['Isi padu kubus = sisi³',`${s} × ${s} × ${s} = ${s**3}`],0,' cm³']},
()=>{var m=R(4,14),n=R(m*m-m+1,m*m+m),r=Math.round(Math.sqrt(n));return[`Anggarkan √${n} kepada integer terdekat.`,r,[`${m-1}² = ${(m-1)**2}, ${m}² = ${m*m}, ${m+1}² = ${(m+1)**2}`,`√${n} ≈ ${Math.sqrt(n).toFixed(2)}`,`Integer terdekat = ${r}`]]}],

()=>{var g=R(2,9),p=R(1,9),q=R(1,9),d=gcd(p,q);p/=d;q/=d;return[`Permudahkan nisbah ${g*p} : ${g*q}.`,`${p} : ${q}`,[`FSTB bagi ${g*p} dan ${g*q} = ${g}`,`${g*p} ÷ ${g} = ${p}`,`${g*q} ÷ ${g} = ${q}`],[`${p+1} : ${q}`,`${p} : ${q+1}`,`${q} : ${p}`,`${g*p} : ${g*q}`]]},
()=>{var p=R(1,7),q=R(1,7);while(q==p)q=R(1,7);var k=R(2,12),T=k*(p+q),m=Math.max(p,q);return[`RM${T} dibahagi mengikut nisbah ${p} : ${q}. Berapakah bahagian yang lebih besar?`,m*k,[`Jumlah bahagian = ${p} + ${q} = ${p+q}`,`1 bahagian = RM${T} ÷ ${p+q} = RM${k}`,`Bahagian besar = ${m} × RM${k} = RM${m*k}`],0,'^RM']},
()=>{var v=R(30,110),t=R(2,6);return[`Sebuah kereta bergerak ${v*t} km dalam ${t} jam. Hitung laju puratanya.`,v,['Laju = jarak ÷ masa',`${v*t} ÷ ${t} = ${v}`],0,' km/j']},
()=>{var u=R(2,15),a=R(3,9),c=R(a+1,15);return[`Harga ${a} buah buku ialah RM${a*u}. Berapakah harga ${c} buah buku?`,c*u,[`Harga 1 buku = RM${a*u} ÷ ${a} = RM${u}`,`Harga ${c} buku = ${c} × RM${u} = RM${c*u}`],0,'^RM']},

()=>{var h=R(3,9),r=R(4,15);return[`Zul bekerja ${h} jam dan memperoleh RM${h*r}. Berapakah kadar upahnya sejam?`,r,['Kadar upah = jumlah upah ÷ bilangan jam',`RM${h*r} ÷ ${h} = RM${r}`],0,'^RM']}],

()=>{var a=R(2,6),b=P([-5,-4,-3,-2,2,3,4,5]),x=R(-4,6),y=R(-4,6),r=a*x+b*y;return[`Nilai ${poly([[a,'x'],[b,'y']])} jika x = ${x} dan y = ${y}.`,r,[`Gantikan: ${a} × ${f(x)} + ${f(b)} × ${f(y)}`,`= ${a*x} + ${f(b*y)}`,`= ${r}`]]},
()=>{var c=[nz(-6,6),nz(-6,6),nz(-6,6),nz(-6,6)],A=c[0]+c[2],B=c[1]+c[3],r=poly([[A,'a'],[B,'b']]);return[`Permudahkan ${poly([[c[0],'a'],[c[1],'b'],[c[2],'a'],[c[3],'b']])}.`,r,[`Sebutan a: ${f(c[0])} + ${f(c[2])} = ${A}`,`Sebutan b: ${f(c[1])} + ${f(c[3])} = ${B}`,`Jawapan: ${r}`],[poly([[A+1,'a'],[B,'b']]),poly([[A,'a'],[B+1,'b']]),poly([[c[0]-c[2],'a'],[B,'b']])]]},
