var NOTE=['Taqwa ialah melaksanakan perintah Allah dan menjauhi larangan-Nya. Ciri: beriman kepada perkara ghaib, mendirikan solat, menginfakkan rezeki dan yakin akan akhirat.','Doa sapu jagat memohon kebaikan dunia dan akhirat serta dijauhi azab neraka (Al-Baqarah ayat 201). Kebahagiaan hakiki ialah kebahagiaan kekal yang diredai Allah.','Tasbih (Subhanallah) menyucikan Allah daripada kekurangan. Tahmid (Alhamdulillah) memuji Allah. Takbir (Allahu Akbar) mengagungkan Allah.','Ayat Kursi (Al-Baqarah ayat 255) menjelaskan kekuasaan mutlak Allah yang mencipta, memelihara dan menentukan segalanya tanpa sekutu.','Hukum nun mati dan tanwin: izhar (jelas), idgham (memasukkan), iqlab (menukar kepada mim apabila bertemu ba, berdengung) dan ikhfa (samar). Mad asli dibaca 2 harakat.','Surah Al-Fatihah ada 7 ayat dan dibaca dalam setiap rakaat solat. Alhamdulillah bermaksud segala puji bagi Allah.','Iblis dilaknat kerana enggan sujud kepada Nabi Adam AS atas sebab sombong. Syaitan ialah musuh nyata manusia. Lindungi diri dengan ta’awwuz, zikir dan solat.','Sabar ada tiga: dalam ketaatan, menjauhi maksiat dan menghadapi ujian. Nabi Ayub AS sabar menghadapi penyakit. Allah bersama orang yang sabar.','Halalan toyyiba ialah halal, bersih dan berkhasiat. Makanan haram: bangkai, darah, daging babi, arak dan sembelihan bukan kerana Allah.','Sumber hukum Islam: Al-Quran, Hadis, Ijmak dan Qias. Hadis ialah perkataan, perbuatan dan pengakuan Nabi Muhammad ﷺ.','Ikhlas ialah beramal semata-mata kerana Allah. Hadis niat: setiap amalan bergantung pada niat. Lawan ikhlas ialah riak.','Jihad ialah bersungguh-sungguh pada jalan Allah: menuntut ilmu, mempertahankan negara dan melawan hawa nafsu (jihad an-nafs).','Fitrah ialah sifat semula jadi manusia yang cenderung kepada tauhid dan kebaikan. Setiap bayi dilahirkan dalam keadaan fitrah dan Islam sesuai dengan fitrah.','Akidah ialah kepercayaan yang teguh. Rukun iman 6: Allah, malaikat, kitab, rasul, hari akhirat, qada dan qadar. Syirik ialah dosa besar.','Sifat wajib Allah: Wujud (ada), Qidam (sedia ada), Baqa (kekal), Mukhalafatuhu lil hawadith (berbeza dengan makhluk), Qiyamuhu binafsihi (berdiri sendiri), Wahdaniyyah (Maha Esa).','Al-Khaliq: Maha Pencipta. Al-Musawwir: Maha Pembentuk rupa. Ar-Razzaq: Maha Pemberi rezeki. Ini ialah Asmaul Husna.','Hukum taklifi ada 5: wajib, sunat, harus, makruh dan haram. Ibadah ialah ketaatan kepada Allah.','Air mutlak suci dan menyucikan (hujan, sungai, laut). Air mustakmal suci tetapi tidak menyucikan. Air mutanajjis bernajis.','Najis mughallazah (anjing dan babi): basuh 7 kali, satu dengan tanah. Mukhaffafah (kencing bayi lelaki yang hanya minum susu): renjis air. Mutawassitah: basuh hingga hilang warna, bau dan rasa.','Istinjak ialah membersihkan najis daripada qubul dan dubur dengan air, batu atau tisu. Gunakan tangan kiri dan jangan menghadap kiblat.','Rukun wuduk 6: niat, basuh muka, basuh tangan hingga siku, sapu sebahagian kepala, basuh kaki hingga buku lali, tertib.','Sebab mandi wajib: haid, nifas, melahirkan anak, junub dan mati. Rukun mandi: niat dan meratakan air ke seluruh tubuh.','Solat fardu 5 waktu: Subuh 2, Zohor 4, Asar 4, Maghrib 3 dan Isyak 4 rakaat. Rukun solat ada 13, bermula niat dan takbiratulihram hingga salam dan tertib.','Nabi Muhammad ﷺ lahir di Makkah pada Tahun Gajah, bergelar al-Amin dan menerima wahyu pertama di Gua Hira. Baginda berhijrah ke Madinah.','Jahiliah: menyembah berhala, menanam anak perempuan, berjudi, riba dan taasub kabilah. Islam membawa tauhid dan keadilan.','Khulafa al-Rasyidin: Abu Bakar (memerangi golongan murtad), Umar (meluaskan wilayah), Uthman (membukukan Mushaf) dan Ali.','Akhlak terpuji: jujur, amanah, sabar dan syukur. Akhlak tercela: bohong, dengki dan riak.','Amanah ialah tanggungjawab yang dipercayakan. Lawannya khianat. Tanda munafik: berbohong, mungkir janji dan khianat amanah.','Menuntut ilmu itu wajib. Wahyu pertama ialah lima ayat pertama Surah Al-Alaq (Iqra). Adab: ikhlas, hormat guru, rajin dan mengamalkan ilmu.','Maruah diri dijaga dengan menutup aurat, menjaga lisan dan menjauhi maksiat. Aurat lelaki antara pusat dan lutut; aurat perempuan seluruh badan kecuali muka dan tapak tangan.'];

var wr=t=>{var w=t.split(' ');if(w.length<2)return[t];var h=Math.ceil(w.length/2);return[w.slice(0,h).join(' '),w.slice(h).join(' ')]};
var tx=(x,y,t,s)=>{var l=wr(t);return l.map((z,i)=>'<text x="'+x+'" y="'+(y+(i-(l.length-1)/2)*(s+1)+s/3)+'" font-size="'+s+'" text-anchor="middle" fill="currentColor" stroke="none">'+e(z)+'</text>').join('')};
var FL='style="fill:var(--card)"';
function dgm(d){var k=d.charAt(0),p=d.slice(2).split(k=='F'?',':';'),o='';
  if(k=='F'){var n=p.length,w=(290-(n-1)*9)/n;p.forEach((t,i)=>{var x=5+i*(w+9);o+='<rect '+FL+' x="'+x+'" y="40" width="'+w+'" height="60" rx="6"/>'+tx(x+w/2,70,t,n>4?8:9);if(i<n-1)o+='<path d="M'+(x+w+1)+' 70 h7 m-3 -3 l3 3 l-3 3"/>'})}
  else if(k=='M'){var Q=[[8,10],[190,10],[8,100],[190,100]];Q.forEach(q=>{o+='<path d="M'+(q[0]+51)+' '+(q[1]+15)+' L150 70"/>'});o+='<ellipse '+FL+' cx="150" cy="70" rx="54" ry="24"/>'+tx(150,70,p[0],10);Q.forEach((q,i)=>{o+='<rect '+FL+' x="'+q[0]+'" y="'+q[1]+'" width="102" height="30" rx="6"/>'+tx(q[0]+51,q[1]+15,p[i+1],9)})}
  else{var r=(p.length-2)/2;[0,1].forEach(c=>{o+='<rect x="'+(8+c*145)+'" y="4" width="139" height="30" rx="4" style="fill:rgba(15,155,98,.25)"/>'+tx(77+c*145,19,p[c],10)});for(var i=0;i<r;i++)[0,1].forEach(c=>{o+='<rect '+FL+' x="'+(8+c*145)+'" y="'+(36+i*34)+'" width="139" height="32" rx="4"/>'+tx(77+c*145,52+i*34,p[2+i*2+c],9)})}
  return '<svg viewBox="0 0 300 140" class="dg" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.6" font-family="sans-serif" role="img">'+o+'</svg>'}
function item(pj,s){var p=s.split('|'),d=p.pop().slice(1);return{q:p[0],a:p[1],o:sh(p.slice(1)),d:d,pj:pj}}
function build(m){var o=[];if(m=='all')PQ.forEach((v,i)=>o.push(item(i+1,v[Math.floor(Math.random()*2)])));else{var b=BD[m];for(var i=b[2];i<=b[3];i++)PQ[i-1].forEach(v=>o.push(item(i,v)));o=sh(o)}return o}
var H={};try{H=JSON.parse(localStorage.getItem('pi1_v1'))||{}}catch(x){}
var A=document.getElementById('app'),C={},tm=s=>Math.floor(s/60)+'m '+s%60+'s';
var NM=m=>m=='all'?'Latihan Penuh 30 Soalan':'Bidang '+BD[m][0];
var ac;function snd(f,d,t){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=.1;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(x){}}
function st(m){var l=H[m]||[];return l.length?l.length+' cubaan · Terbaik '+l.reduce((a,x)=>Math.max(a,x.p),0)+'/'+l[0].n:'Belum dimain'}
function menu(){var h='<button class="bk" onclick="location.href=HOME">🏠 Halaman Utama (pilih subjek lain)</button><div class="card"><div class="big">🕌</div><h1>Pendidikan Islam Tingkatan 1</h1><p>30 soalan objektif, setiap soalan ada gambar rajah.</p></div><div class="card un"><div class="tx"><b>Latihan Penuh 30 Soalan</b><small>Satu soalan bagi setiap pelajaran · '+st('all')+'</small></div><div class="bt"><button class="b5" onclick="nt(\'all\')">📘</button><button onclick="go(\'all\')">▶️</button><button class="b3" onclick="hist(\'all\')">📒</button></div></div><p><b>Latihan mengikut bidang</b></p>';
  BD.forEach((b,i)=>{h+='<div class="card un"><div class="tx"><b>'+b[1]+' '+b[0]+'</b><small>Pelajaran '+b[2]+(b[3]>b[2]?' – '+b[3]:'')+' · '+st(i)+'</small></div><div class="bt"><button class="b5" onclick="nt('+i+')">📘</button><button onclick="go('+i+')">▶️</button><button class="b3" onclick="hist('+i+')">📒</button></div></div>'});
  A.innerHTML=h;scrollTo(0,0)}
function nt(m){var a=m=='all'?1:BD[m][2],b=m=='all'?30:BD[m][3],h='<button class="bk" onclick="menu()">⬅️ Kembali</button><div class="card"><h2>📘 Nota Ringkas</h2><p>'+NM(m)+'</p></div><div class="card nt">';
  for(var i=a;i<=b;i++)h+='<p><b>Pelajaran '+i+': '+e(PJ[i-1])+'</b>'+e(NOTE[i-1])+'</p>';
  A.innerHTML=h+'</div><button class="b4" onclick="go(\''+m+'\')">▶️ Mula Latihan</button>';scrollTo(0,0)}
function go(m){C={m:m,q:build(m),i:0,p:0,t0:Date.now(),w:[]};show()}
function show(){if(C.i>=C.q.length)return end();var q=C.q[C.i];C.lock=0;C.cur=q;
  A.innerHTML='<div class="top"><button class="bk" onclick="menu()">⬅️</button><span>'+(C.i+1)+'/'+C.q.length+'</span><span>⭐ '+C.p+'</span></div><div class="bar"><i style="width:'+C.i/C.q.length*100+'%"></i></div><div class="card"><div class="lb">Pelajaran '+q.pj+': '+e(PJ[q.pj-1])+'</div>'+dgm(q.d)+'<div class="q">'+e(q.q)+'</div></div><div class="ans">'+q.o.map((o,i)=>'<button onclick="pk('+i+')">'+e(o)+'</button>').join('')+'</div><div id="fb"></div>';scrollTo(0,0)}
function pk(i){if(C.lock)return;C.lock=1;var q=C.cur,ok=q.o[i]==q.a,bs=document.querySelectorAll('.ans button');
  bs.forEach((b,j)=>{if(q.o[j]==q.a)b.classList.add('ok')});
  if(ok){C.p++;snd(660,.15)}else{bs[i].classList.add('no','sh');C.w.push(q);snd(200,.3,'square')}
  var fb=document.getElementById('fb');fb.innerHTML='<div class="fb"><b>'+(ok?'Betul! 🎉':'Belum tepat 💪 Jawapan: '+e(q.a))+'</b><br>📝 '+e(NOTE[q.pj-1])+'</div><button class="nx" onclick="C.i++;show()">'+(C.i+1>=C.q.length?'Lihat Keputusan 🏁':'Seterusnya ➡️')+'</button>';fb.scrollIntoView({behavior:'smooth',block:'end'})}
function end(){var n=C.q.length,sec=Math.round((Date.now()-C.t0)/1000),r=C.p/n,s3=r>=.9?3:r>=.65?2:r>=.4?1:0;
  H[C.m]=[{t:Date.now(),p:C.p,n:n,sec:sec}].concat(H[C.m]||[]).slice(0,30);try{localStorage.setItem('pi1_v1',JSON.stringify(H))}catch(x){}
  snd(s3>1?880:300,.4);
  A.innerHTML='<div class="card"><div class="big">'+(s3>1?'🏆':'📖')+'</div><h1>Selesai!</h1><p>'+NM(C.m)+'</p><div class="st">'+'⭐'.repeat(s3)+'☆'.repeat(3-s3)+'</div><p>Markah: <b>'+C.p+'/'+n+'</b> ('+Math.round(r*100)+'%) · Masa '+tm(sec)+'</p></div>'
  +(C.w.length?'<div class="card"><b>Semak soalan yang salah ('+C.w.length+')</b>'+C.w.map(q=>'<div class="row"><span>❌</span><span><small>Pelajaran '+q.pj+' (ada rajah)</small><br>'+e(q.q)+'<br><b>Jawapan: '+e(q.a)+'</b></span></div>').join('')+'</div>':'')
  +'<button class="b4" onclick="go(\''+C.m+'\')">🔁 Main Semula</button><button class="b5" onclick="nt(\''+C.m+'\')">📘 Nota</button><button class="b3" onclick="hist(\''+C.m+'\')">📒 Sejarah</button><button onclick="menu()">🕌 Menu Pendidikan Islam</button><button style="background:#e8507a" onclick="location.href=HOME">🏠 Halaman Utama (subjek lain)</button>';scrollTo(0,0)}
function hist(m){var l=H[m]||[],b=l.reduce((a,x)=>Math.max(a,x.p),0),av=l.length?Math.round(l.reduce((a,x)=>a+x.p/x.n,0)/l.length*100):0;
  var h='<button class="bk" onclick="menu()">⬅️ Kembali</button><div class="card"><h2>📒 Sejarah</h2><p>'+NM(m)+'</p><p>'+l.length+' cubaan · Terbaik '+b+' · Purata '+av+'%</p></div>';
  if(!l.length)h+='<div class="card"><p>Belum ada aktiviti. Jom cuba! 🚀</p></div>';
  else h+='<div class="card"><b>Cubaan terkini</b>'+l.map((x,i)=>'<div class="row"><span style="flex:1">'+(i?'':'🆕 ')+new Date(x.t).toLocaleString('ms-MY',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'<br><b>'+x.p+'/'+x.n+'</b> · '+tm(x.sec)+'<div class="pb"><i style="width:'+x.p/x.n*100+'%"></i></div></span></div>').join('')+'</div>';
  A.innerHTML=h+'<button class="b4" onclick="go(\''+m+'\')">▶️ Main Sekarang</button>';scrollTo(0,0)}
(function(){var f=document.createElement('div');f.id='fx';var E=['🕌','⭐','🌙','📖','✨','🤲','🌸','🎈'];for(var i=0;i<14;i++){var s=document.createElement('span');s.textContent=E[i%E.length];s.style.cssText='left:'+Math.random()*95+'%;font-size:'+(20+Math.random()*24)+'px;animation-duration:'+(14+Math.random()*14)+'s;animation-delay:-'+Math.random()*20+'s';f.appendChild(s)}document.body.prepend(f)})();
menu();
</script>
