function build(b){return sh(SC[b-1].m).slice(0,30).map(s=>{var p=s.split('|'),dg=null;if(p[p.length-1].charAt(0)=='@')dg=p.pop().slice(1);return{q:p[0],a:p[1],o:sh(p.slice(1)),dg:dg}})}
